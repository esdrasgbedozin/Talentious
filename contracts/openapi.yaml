openapi: 3.0.3
info:
  title: Talentious Backend API
  version: "1.1.0"
  description: |
    API backend de la plateforme Talentious — génération de CV et de lettres de
    motivation assistée par IA. Version 1.1.0 : extension V2 (Templates, Thèmes CV,
    Lettre de motivation, Score ATS, Export PDF/docx, Relecture IA, multilingue FR/EN),
    strictement rétro-compatible avec la V1 (aucun endpoint existant n'est supprimé
    ni modifié de façon incompatible ; le versionnage reste `/v1`).

    ## Sécurité
    Tous les endpoints nécessitent un JWT Bearer valide (HS256, 30 min), sauf :
    - `POST /auth/register` et `POST /auth/login` : publics (security: [])
    - `POST /billing/webhook` : public mais authentifié par signature HMAC Stripe
      via l'en-tête `Stripe-Signature` — aucun JWT Talentious n'est attendu.

    ## CareerPass (Pass) et gating
    Le Pass (un CareerPass acheté, `career_passes.valid_until > now()`) débloque la
    GÉNÉRATION et l'ÉDITION premium. Un utilisateur avec le rôle `admin` bypasse ces
    contrôles. Le gating est toujours appliqué côté serveur.

    - Offre gratuite : 1 Template gratuit, Thème CV du Template, langue `fr`,
      1 Variante de CV, Score ATS sans détail, export PDF.
    - Premium (Pass actif) : tous les Templates, Thème CV personnalisé, langue `en`,
      Variantes illimitées, Lettre de motivation, détail du Score ATS, export `docx`,
      Relecture IA.
    - Une demande de génération ou d'édition premium sans Pass actif est refusée par
      `402` au format RFC 7807 (voir `components/responses/PassRequired`).
    - Principe anti-ressentiment (décision D1) : un document déjà créé reste TOUJOURS
      consultable et re-téléchargeable (PDF et docx), même après expiration du Pass.
      Le gating des lectures et téléchargements est l'ownership (le document appartient
      à l'utilisateur), jamais le Pass. Seules la génération et l'édition premium se
      verrouillent ; l'état « verrouillé » est calculé à la volée (`is_editable`), jamais
      persisté.

    ## Erreurs
    Toutes les erreurs suivent le standard RFC 7807 (`application/problem+json`).
    Voir le schéma `Problem` dans `components/schemas`.

    ## Traitements asynchrones (jobs)
    La génération de CV, la génération de lettre, l'export et la relecture IA sont
    asynchrones. L'endpoint de lancement retourne `202` avec un `job_id` ; l'état est
    consultable via `GET /jobs/{job_id}` (schéma `JobStatus`, champ `job_type`). Une fois
    le job en état `succeeded`, le champ `result` désigne la ressource produite
    (CV : `GET /cv/{cv_id}`, Lettre : `GET /letters/{letter_id}`, export : `download_url`,
    relecture : `result.review`).

    `GET /cv/jobs/{job_id}` est conservé comme alias DÉPRÉCIÉ pour les jobs
    `cv_generation` (rétro-compatibilité V1). Un canal SSE optionnel reste disponible sur
    `GET /cv/jobs/{job_id}/events` pour les jobs `cv_generation` uniquement.

    Transitions d'état d'un job : queued -> running -> succeeded | failed.
    Unicité : un seul job actif (`queued` ou `running`) par couple (utilisateur, `job_type`) ;
    un nouveau lancement du même type répond `409`.

    ## Contenu canonique et enveloppe
    Chaque type de document a UN SEUL schéma de contenu, qui est à la fois la sortie de
    l'agent rédacteur, la charge utile stockée en JSONB, l'entrée du rendu (PDF/docx) et
    le modèle d'édition : `GeneratedCVData` pour le CV, `CoverLetterContent` pour la lettre.
    Aucune transformation entre ces usages. Le contenu ne porte AUCUNE information de forme.

    La forme vit dans l'ENVELOPPE du document (Variante de CV, Lettre) : `template_id`,
    `theme` (snapshot, jamais une référence mutable) et `language`. Un même contenu est
    donc portable d'un Template à l'autre.
  license:
    name: Proprietary
    url: https://talentious.fr/legal/terms

servers:
  - url: https://api.talentious.fr/v1
    description: Production
  - url: https://api-staging.talentious.fr/v1
    description: Staging
  - url: http://localhost:8000/v1
    description: Développement local

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Inscription, connexion, utilisateur courant
  - name: Profile
    description: Profil maître de l'utilisateur (CRUD)
  - name: CV
    description: Gestion des CV générés (Variantes, Bibliothèque), Templates et Thèmes CV
  - name: CV Jobs
    description: Suivi asynchrone de la génération de CV (alias déprécié, voir Jobs)
  - name: Jobs
    description: Suivi asynchrone générique (génération de CV, génération de lettre, export, relecture)
  - name: Letters
    description: Lettres de motivation (génération, Bibliothèque, édition)
  - name: ATS
    description: Score ATS d'un CV face à une offre
  - name: Export
    description: Export PDF et docx d'un document (CV, Lettre)
  - name: Review
    description: Relecture IA d'un CV (suggestions acceptées ou refusées par l'utilisateur)
  - name: Billing
    description: Paiement Stripe et CareerPass
  - name: Account
    description: Gestion du compte utilisateur (RGPD)

# =============================================================================
# PATHS
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Créer un nouveau compte utilisateur
      description: |
        Crée un utilisateur avec le rôle `USER` par défaut et initialise
        un profil vide. Aucun JWT n'est requis. Un email de vérification est
        envoyé ; la connexion est refusée (403) tant que l'adresse n'est pas
        confirmée.

        Anti-squat : si l'email correspond à un compte existant NON vérifié,
        aucune erreur « déjà utilisé » n'est renvoyée — l'email de vérification
        est simplement renvoyé à l'adresse (le compte n'est pas modifié). Le
        titulaire réel de l'adresse récupère le compte via vérification puis
        « mot de passe oublié ». Le 400 « déjà enregistré » n'est renvoyé que
        pour un compte VÉRIFIÉ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Compte créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Email déjà utilisé
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "https://talentious.fr/errors/email-already-registered"
                title: "Email Already Registered"
                status: 400
                detail: "An account with this email address already exists."
                instance: "/v1/auth/register"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: S'authentifier et obtenir un JWT
      description: |
        Authentification par email/mot de passe. Retourne un JWT Bearer valide 30 minutes.
        Le champ `username` du formulaire doit contenir l'adresse email
        (convention OAuth2PasswordRequestForm).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginForm"
      responses:
        "200":
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Identifiants invalides
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "https://talentious.fr/errors/invalid-credentials"
                title: "Invalid Credentials"
                status: 401
                detail: "Incorrect email or password."
                instance: "/v1/auth/login"
        "403":
          description: |
            Adresse email non vérifiée. Les identifiants sont corrects mais la
            connexion est refusée tant que l'adresse n'a pas été confirmée
            (empêche l'usage d'un compte créé avec l'adresse d'autrui). Le client
            doit proposer le renvoi de l'email (POST /auth/verify-email/resend).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "https://talentious.fr/errors/email-not-verified"
                title: "Forbidden"
                status: 403
                detail: "Adresse email non vérifiée. Consultez votre boîte mail ou renvoyez l'email de confirmation."
                instance: "/v1/auth/login"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/google:
    post:
      tags: [Auth]
      operationId: loginWithGoogle
      summary: S'authentifier avec Google (Sign in with Google)
      description: |
        Authentification par jeton d'identité Google (Google Identity Services,
        flux « credential »). Le backend vérifie la signature et l'audience du
        jeton auprès de Google, puis :

        - **compte existant avec cet email** : liaison automatique (l'email est
          garanti vérifié par Google — le compte est marqué vérifié si besoin)
          et connexion ;
        - **aucun compte** : création d'un compte SANS mot de passe
          (`google_id` renseigné), email déjà vérifié — aucune étape de
          confirmation.

        La session émise est identique au login classique : access token 30 min
        + cookie de rafraîchissement httpOnly avec rotation. Un compte
        Google-only qui tente le login par mot de passe reçoit `401` avec un
        message l'invitant à utiliser Google.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  description: Jeton d'identité (JWT) émis par Google Identity Services
      responses:
        "200":
          description: Authentification réussie (compte créé ou lié si nécessaire)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Jeton Google invalide, expiré ou d'audience inattendue
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirmer une adresse email via le token du lien
      description: |
        Valide l'adresse email à partir du token du lien de vérification.
        Idempotent : vérifier un compte déjà vérifié réussit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email confirmé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Lien invalide ou expiré
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Renvoyer l'email de vérification (utilisateur connecté)
      description: |
        Renvoie le lien de vérification à l'utilisateur authentifié. Réponse
        toujours 204 (ne révèle pas l'état de vérification).
      responses:
        "204":
          description: Demande prise en compte (email renvoyé si nécessaire)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Renouveler l'access token via le refresh token (cookie)
      description: |
        Échange le refresh token (cookie httpOnly `talentious_refresh`, envoyé
        automatiquement) contre un nouvel access token. Rotation du refresh
        token à chaque appel ; la réutilisation d'un token déjà échangé révoque
        toute la famille (détection de vol).
      security: []
      responses:
        "200":
          description: Nouvel access token (et refresh token renouvelé en cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Refresh token absent, invalide, expiré ou révoqué
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Se déconnecter (révoque le refresh token)
      description: |
        Révoque le refresh token courant côté serveur et efface le cookie.
        Idempotent : réussit même sans session active.
      responses:
        "204":
          description: Déconnecté (refresh token révoqué, cookie effacé)

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Demander un email de réinitialisation de mot de passe
      description: |
        Envoie un lien de réinitialisation à l'adresse fournie. Réponse
        toujours 204 (enumeration-safe : ne révèle pas si l'email existe).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: Demande prise en compte (email envoyé si le compte existe)
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Réinitialiser le mot de passe via le token du lien
      description: |
        Définit un nouveau mot de passe à partir du token du lien de
        réinitialisation. Révoque toutes les sessions existantes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Mot de passe réinitialisé, sessions révoquées
        "400":
          description: Lien invalide ou expiré
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationPublic
      summary: Renvoyer l'email de vérification (public)
      description: |
        Renvoie l'email de vérification d'un compte non vérifié. Endpoint PUBLIC
        (écran de connexion, avant authentification). Réponse constante 204
        quelle que soit l'existence du compte (anti-énumération) ; envoi effectif
        uniquement si le compte existe et n'est pas vérifié. Rate-limité.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: Demande acceptée (réponse constante, anti-énumération)
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Trop de demandes (rate limit)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Changer son mot de passe (connecté)
      description: |
        Change le mot de passe de l'utilisateur authentifié. Exige le mot de
        passe actuel (ré-authentification). Par sécurité, toutes les sessions
        (refresh tokens) sont révoquées et une notification est envoyée par email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Mot de passe changé, sessions révoquées
        "401":
          description: Mot de passe actuel incorrect (ou non authentifié)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/email/change:
    post:
      tags: [Auth]
      operationId: requestEmailChange
      summary: Demander le changement d'adresse email (connecté)
      description: |
        Envoie un lien de confirmation à la NOUVELLE adresse (l'adresse du compte
        ne change qu'après confirmation — la nouvelle boîte fait autorité). Exige
        le mot de passe actuel. Rate-limité (envoi d'email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, current_password]
              properties:
                new_email:
                  type: string
                  format: email
                current_password:
                  type: string
      responses:
        "204":
          description: Lien de confirmation envoyé à la nouvelle adresse
        "400":
          description: Nouvelle adresse invalide (déjà utilisée ou identique à l'actuelle)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Mot de passe actuel incorrect (ou non authentifié)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Trop de demandes (rate limit)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/email/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmailChange
      summary: Confirmer le changement d'adresse email (lien reçu)
      description: |
        Applique le changement d'adresse depuis le jeton reçu sur la NOUVELLE
        boîte. Endpoint public (le lien est cliqué depuis l'email). L'ancienne
        adresse reçoit une notification de sécurité.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Adresse mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Jeton invalide/expiré, ou adresse devenue indisponible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Obtenir les informations de l'utilisateur courant
      responses:
        "200":
          description: Informations de l'utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Profile
  # ---------------------------------------------------------------------------

  /profile/import-cv:
    post:
      tags: [Profile]
      operationId: importCvPdf
      summary: Lancer l'import asynchrone d'un CV ou export LinkedIn (PDF)
      description: |
        Import ASYNCHRONE : le PDF est validé (type, taille) puis un job
        d'extraction est lancé en arrière-plan (agent parser-pdf : PyMuPDF
        puis structuration Gemini, 20-60 s). La réponse est immédiate (`202`
        + `job_id`) ; l'état se consulte via
        `GET /profile/import-cv/jobs/{job_id}`.

        Pourquoi asynchrone : la façade CDN coupe toute requête à 60 s ; une
        extraction lente rendait la réponse synchrone imprévisible.

        Le brouillon produit N'EST JAMAIS persisté : le job (et son résultat)
        vit en mémoire du serveur ≤ 15 minutes puis disparaît. L'utilisateur
        relit le brouillon dans le formulaire de profil puis sauvegarde via
        PUT /profile (validation canonique). Cette relecture humaine est le
        garde-fou final contre l'injection de prompt (le PDF est une entrée
        non fiable).

        Gère les CV classiques et les exports PDF LinkedIn (fr/en).
        Limites : 10 Mo, 20 pages, 5 imports/heure/utilisateur (rate limit),
        un seul import actif à la fois (`409`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Fichier PDF (max 10 Mo, application/pdf)
      responses:
        "202":
          description: Job d'import accepté
          headers:
            Location:
              description: URL de suivi du job (`/v1/profile/import-cv/jobs/{job_id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobAccepted"
        "400":
          description: Fichier absent, non-PDF, vide ou trop volumineux
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Un import est déjà en cours pour cet utilisateur
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Limite d'imports atteinte (5/heure)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /profile/import-cv/jobs/{job_id}:
    get:
      tags: [Profile]
      operationId: getImportJobStatus
      summary: Consulter l'état d'un job d'import de CV
      description: |
        Retourne l'état courant du job d'import : `running`, `succeeded` ou
        `failed`. En cas de succès, `profile_data` (brouillon) et `warnings`
        sont renseignés — le client doit les présenter en relecture, rien
        n'est persisté côté serveur.

        Les jobs sont éphémères (mémoire, ≤ 15 minutes) et liés à leur
        propriétaire : un job inconnu, expiré ou appartenant à un autre
        utilisateur répond `404`. Le client doit alors proposer de relancer
        l'import.

        Cas d'échec (`failed`) : PDF sans texte extractible, agent
        indisponible, brouillon hors contrat — `error_message` précise la
        cause à afficher.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: État du job d'import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Lire le profil maître de l'utilisateur courant
      description: |
        Retourne le profil JSONB de l'utilisateur. Si aucun profil n'existe encore,
        un profil vide est créé automatiquement avant d'être retourné.
      responses:
        "200":
          description: Profil de l'utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [Profile]
      operationId: updateProfile
      summary: Mettre à jour le profil maître
      description: |
        Remplace l'intégralité du profil JSONB. Le corps doit contenir le ProfileData
        canonique complet (pas de patch partiel).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------
  # CV — Génération asynchrone
  # ---------------------------------------------------------------------------

  /cv/generate:
    post:
      tags: [CV]
      operationId: generateCV
      summary: Lancer la génération asynchrone d'un CV
      description: |
        Soumet une demande de génération de CV et retourne immédiatement un `job_id`
        (`job_type` = `cv_generation`). La génération réelle (2-5 min) se fait en
        arrière-plan ; l'état se consulte via `GET /jobs/{job_id}`.

        Le CV produit est une Variante de CV : contenu canonique (`GeneratedCVData`)
        + enveloppe (`template_id`, `theme`, `language`). `template_id` (défaut
        `modern_sobre`), `theme` (défaut : Thème CV du Template) et `target_language`
        (défaut `fr`) sont optionnels : une requête V1 (`cv_name` + `offer_text`)
        reste valide. `target_language` pilote la RÉÉCRITURE du contenu dans la langue
        cible en visant l'offre (pas une traduction littérale).

        Gating (Pass) : sans Pass actif, la génération reste possible avec les
        capacités gratuites (Template gratuit, thème du Template, langue `fr`,
        première Variante). Toute capacité premium demandée sans Pass actif répond
        `402` (Template premium, Thème personnalisé, langue `en`, Variante au-delà de
        la première) ; le champ `type` du Problem précise le motif. Le rôle `admin`
        bypasse ces contrôles. L'utilisateur doit avoir un profil avec au moins une
        expérience renseignée.

        Idempotency : une seule génération de CV active par utilisateur à la fois.
        Si un job `cv_generation` est déjà en état `queued` ou `running` pour
        l'utilisateur courant, la réponse est `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCVRequest"
      responses:
        "202":
          description: Job de génération accepté
          headers:
            Location:
              description: URL de suivi du job (`/v1/jobs/{job_id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateCVJobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PassRequired"
        "404":
          description: Profil utilisateur introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Une génération est déjà en cours
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "https://talentious.fr/errors/generation-in-progress"
                title: "Generation Already In Progress"
                status: 409
                detail: "A CV generation job is already running for your account. Please wait for it to complete."
                instance: "/v1/cv/generate"
        "429":
          description: |
            Plafond journalier de générations atteint (utilisateur SANS Pass actif :
            frein de coût IA, calculé sur les jobs `cv_generation` des dernières 24 h,
            quel que soit le sort des documents produits — supprimer un CV ne recharge
            pas le compteur). Les porteurs de Pass et les admins ne sont pas concernés ;
            le plafond GLOBAL (kill-switch applicatif, `ai-daily-cap`) arrive à M6-T03.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "https://talentious.fr/errors/generation-daily-cap"
                title: "Too Many Requests"
                status: 429
                detail: "Daily free generation limit reached. Try again tomorrow or activate a Career Pass."
                instance: "/v1/cv/generate"
        "422":
          description: |
            Erreur de validation du corps de la requête : champ invalide, `template_id`
            inconnu, ou Thème CV refusé (couleur hors format hex, police hors liste
            blanche, contraste insuffisant).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "https://talentious.fr/errors/validation-error"
                title: "Validation Error"
                status: 422
                detail: "Request body validation failed."
                instance: "/v1/cv/generate"

  /cv/jobs/{job_id}:
    get:
      tags: [CV Jobs]
      operationId: getCVJobStatus
      deprecated: true
      summary: Consulter l'état d'un job de génération de CV (déprécié)
      description: |
        **Déprécié** : utiliser `GET /jobs/{job_id}`. Conservé pour la
        rétro-compatibilité V1 ; ne couvre que les jobs `cv_generation` (un
        `job_id` d'un autre type répond `404`). Les transitions et le schéma de
        réponse (`CVJobStatus`) sont inchangés.

        Retourne l'état courant du job : `queued`, `running`, `succeeded` ou `failed`.

        - `queued` : en attente d'un worker.
        - `running` : traitement en cours ; le champ `progress_pct` indique l'avancement (0-100).
        - `succeeded` : génération terminée ; `cv_id` est renseigné.
        - `failed` : la génération a échoué ; `error_message` contient un message générique.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: État du job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVJobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cv/jobs/{job_id}/events:
    get:
      tags: [CV Jobs]
      operationId: getCVJobEvents
      summary: Flux SSE de progression du job (optionnel)
      description: |
        Canal Server-Sent Events pour suivre en temps réel la progression d'un job
        de génération. Le client reçoit des événements `progress` (avec `progress_pct`)
        et un événement `done` (avec `cv_id` en cas de succès, ou `error` en cas d'échec).

        Ce canal est optionnel : le polling sur `GET /jobs/{job_id}` est
        l'alternative recommandée si SSE n'est pas supporté côté client. Le canal
        SSE ne couvre que les jobs `cv_generation` ; les autres types de jobs
        (lettre, export, relecture) se suivent par polling uniquement.

        Formats SSE émis :

        Progression : `event: progress` / `data: {"progress_pct": 45, "step": "analyzing_offer"}`

        Succes : `event: done` / `data: {"status": "succeeded", "cv_id": "<uuid>"}`

        Echec : `event: done` / `data: {"status": "failed", "error": "Generation failed. Please retry."}`
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Flux SSE ouvert
          content:
            text/event-stream:
              schema:
                type: string
                description: Flux d'événements SSE (voir description de l'opération pour les formats)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # CV — CRUD
  # ---------------------------------------------------------------------------

  /cv:
    get:
      tags: [CV]
      operationId: listCVs
      summary: Lister tous les CV de l'utilisateur courant
      description: |
        Retourne la liste paginée des CV générés (Bibliothèque de CV : toutes les
        Variantes de l'utilisateur), sans le contenu JSON complet. Chaque entrée
        porte l'enveloppe (`template_id`, `theme`, `language`) pour l'affichage.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Liste des CV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CVListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cv/templates:
    get:
      tags: [CV]
      operationId: listCVTemplates
      summary: Lister les Templates disponibles
      description: |
        Retourne le registre des Templates (mises en page prédéfinies, un par secteur).
        Tous les Templates sont listés, gratuits comme premium, afin de permettre
        l'aperçu : `is_free` indique si le Template est utilisable sans Pass.
        Utiliser un Template premium sans Pass actif répond `402` à la génération
        ou à l'édition (`premium-template-required`).

        Le registre est piloté par les données (table de référence), pas codé en dur.
        Chemin littéral : prioritaire sur `/cv/{cv_id}`.
      responses:
        "200":
          description: Liste des Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CVTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cv/themes:
    get:
      tags: [CV]
      operationId: listCVThemes
      summary: Lister les presets de Thème CV
      description: |
        Retourne les presets de Thème CV curatés (lecture seule, système). Un preset
        est un point de départ : le client envoie le thème choisi (preset tel quel ou
        modifié) INLINE à la génération ou à l'édition, et le serveur le SNAPSHOTE
        dans le document. Aucune référence mutable vers un preset n'est stockée.

        Le preset gratuit est le thème quasi-monochrome anthracite du Template
        « Moderne sobre » (`is_free` = true). Chemin littéral : prioritaire sur
        `/cv/{cv_id}`.
      responses:
        "200":
          description: Liste des presets de Thème CV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CVTheme"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cv/{cv_id}:
    get:
      tags: [CV]
      operationId: getCV
      summary: Obtenir le détail complet d'un CV
      description: |
        Lecture d'un Document existant : gating par ownership uniquement, jamais par
        le Pass (le CV reste consultable après expiration du Pass).
      parameters:
        - $ref: "#/components/parameters/cvIdPath"
      responses:
        "200":
          description: CV complet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [CV]
      operationId: updateCV
      summary: Mettre à jour le nom, le contenu ou l'enveloppe d'un CV
      description: |
        Met à jour le nom du CV (`cv_name`), son contenu JSON (`cv_data_json`) et/ou
        son enveloppe (`template_id`, `theme`, `language`). Mise à jour PARTIELLE :
        seuls les champs fournis sont modifiés (sémantique historique V1 conservée
        sur `PUT`).
        Utilisé notamment par l'éditeur WYSIWYG pour sauvegarder les modifications manuelles.

        ÉCART ASSUMÉ (acté fondateur 2026-10-19) : cet endpoint garde `PUT` à sémantique
        partielle pour ne pas casser le frontend V1, alors que les lettres introduites en
        V2 utilisent `PATCH` (sémantique REST correcte). Harmonisation de `/cv/{cv_id}`
        vers `PATCH` planifiée en roadmap, non bloquante.

        Changer `template_id` ou `theme` ne modifie jamais `cv_data_json` (le contenu
        est portable). Changer `language` met à jour la langue de RENDU (titres de
        sections, mois) ; il ne traduit pas le contenu (pas d'endpoint de traduction).

        Gating (Pass) : l'édition premium exige un Pass actif ou un document
        entièrement gratuit (Template gratuit, thème du Template, langue `fr`). Sinon
        `402`. Renommer ou éditer le contenu d'un CV entièrement gratuit reste possible
        sans Pass.
      parameters:
        - $ref: "#/components/parameters/cvIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCVRequest"
      responses:
        "200":
          description: CV mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CVDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PassRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [CV]
      operationId: deleteCV
      summary: Supprimer un CV
      description: |
        Supprime le CV. Les Lettres liées (`cv_id`) ne sont pas supprimées : leur
        `cv_id` passe à `null`. La purge du fichier d'export associé dans le stockage
        relève de l'effacement RGPD (ticket dédié).
      parameters:
        - $ref: "#/components/parameters/cvIdPath"
      responses:
        "204":
          description: CV supprimé avec succès (aucun corps)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # CV — Score ATS, Export, Relecture
  # ---------------------------------------------------------------------------

  /cv/{cv_id}/ats-score:
    post:
      tags: [ATS]
      operationId: computeATSScore
      summary: Calculer le Score ATS d'un CV face à une offre
      description: |
        Calcule SYNCHRONEMENT le Score ATS (0-100) d'un CV face à une offre : recouvrement
        entre les mots-clés de l'Analyse d'offre et le contenu du CV. Le calcul du score
        est déterministe et reproductible (aucun appel LLM) : mêmes entrées, même score.
        La réponse est immédiate (`200`), sans job.

        L'offre est fournie soit en texte (`offer_text`), soit par référence
        (`job_offer_id`, identifiant d'une Offre déjà enregistrée, retourné dans
        `ATSScoreResult.job_offer_id`) — exactement l'un des deux. L'Analyse d'offre est
        mise en cache par empreinte du texte : seule la première analyse d'une offre
        inconnue peut dépasser la latence habituelle (appel de l'agent analyseur-offre),
        d'où le `502` possible.

        Le score seul est gratuit. Pour un utilisateur sans Pass actif, le serveur
        TRONQUE le détail (`detail_truncated` = true : `matched_keywords` et
        `missing_keywords` partiels ou vides, `missing_keywords_count` toujours
        renseigné). Le détail complet est premium. Le mécanisme est documenté ici ; le
        volume gratuit éventuel (plafond par offre ou par jour, décision produit D3 OUVERTE)
        n'est PAS figé par ce contrat — il se traduirait par un `429`.

        Le score est un indicateur d'aide, non une garantie de passage dans un outil de
        recrutement réel (formulation exacte : décision D10 ouverte). Les suggestions de
        correction rédigées par l'IA relèvent de la Relecture IA
        (`POST /cv/{cv_id}/review`), pas de cet endpoint.
      parameters:
        - $ref: "#/components/parameters/cvIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ATSScoreRequest"
      responses:
        "200":
          description: Score ATS calculé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ATSScoreResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: CV ou offre (`job_offer_id`) introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: |
            Volume de scores atteint. Réservé à la politique de limitation du palier
            gratuit (décision produit D3 OUVERTE : plafond non défini par ce contrat).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Analyse d'offre indisponible (agent analyseur-offre en erreur)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /cv/{cv_id}/export:
    post:
      tags: [Export]
      operationId: exportCV
      summary: Lancer l'export asynchrone d'un CV (PDF ou docx)
      description: |
        Lance la production d'un fichier téléchargeable du CV (`job_type` = `export`).
        Réponse `202` + `job_id` ; le client interroge `GET /jobs/{job_id}` jusqu'à
        `succeeded`, puis lit `result.download_url` (URL de téléchargement servie
        par le backend — download PROXIFIÉ, ADR-EXPORT-DELIVERY ; `result.expires_at`). Le PDF est rendu côté serveur (fidèle et déterministe) ;
        le docx est produit depuis le contenu structuré, avec une mise en forme
        simplifiée (fidélité exacte au PDF : décision D8 ouverte).

        Gating = ownership (décision D1) : exporter ou re-télécharger un document DÉJÀ
        POSSÉDÉ est autorisé sans Pass actif. Ce n'est pas une action premium. Si un
        fichier à jour existe déjà pour ce contenu, ce thème et ce format, il est
        resservi sans nouveau rendu. Seule la première production de docx pour un
        utilisateur sans Pass actif sur un document sans docx existant est premium
        (`402`).

        Idempotency : un seul export actif par utilisateur à la fois (`409`).
      parameters:
        - $ref: "#/components/parameters/cvIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Job d'export accepté
          headers:
            Location:
              description: URL de suivi du job (`/v1/jobs/{job_id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PassRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JobConflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cv/{cv_id}/review:
    post:
      tags: [Review]
      operationId: reviewCV
      summary: Lancer la Relecture IA d'un CV (premium)
      description: |
        Lance une Relecture IA du CV (`job_type` = `review`) : l'IA analyse le contenu
        existant et propose des suggestions d'amélioration. Réponse `202` + `job_id` ;
        une fois le job `succeeded`, `GET /jobs/{job_id}` retourne le `ReviewResult` dans
        `result.review`. La relecture ne modifie JAMAIS le CV : l'utilisateur accepte ou
        refuse chaque suggestion, puis enregistre via `PUT /cv/{cv_id}`.

        Si le CV est lié à une Offre (`job_offer_id`), la relecture est orientée offre ;
        aucun corps de requête n'est attendu.

        Capacité premium : Pass actif requis (`402`). La portée exacte (une relecture par
        document ou illimitée tant que le Pass est actif ; contenu seul ou aussi la forme,
        décision D9 OUVERTE) n'est PAS figée par ce contrat. Un plafond éventuel se
        traduirait par un `429`.

        Idempotency : une seule relecture active par utilisateur à la fois (`409`).
      parameters:
        - $ref: "#/components/parameters/cvIdPath"
      responses:
        "202":
          description: Job de relecture accepté
          headers:
            Location:
              description: URL de suivi du job (`/v1/jobs/{job_id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewJobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PassRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JobConflict"
        "429":
          description: |
            Plafond de relectures atteint. Réservé à la politique de limitation
            (décision produit D9 OUVERTE : plafond non défini par ce contrat).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ---------------------------------------------------------------------------
  # Lettres de motivation
  # ---------------------------------------------------------------------------

  /letters/generate:
    post:
      tags: [Letters]
      operationId: generateLetter
      summary: Lancer la génération asynchrone d'une lettre de motivation (premium)
      description: |
        Soumet une demande de génération de lettre pour UNE offre et retourne
        immédiatement un `job_id` (`job_type` = `letter_generation`). Une fois le job
        `succeeded`, la lettre est accessible via `GET /letters/{letter_id}`
        (`result.result_id`).

        L'offre est fournie soit en texte (`offer_text`), soit par référence
        (`job_offer_id`) — exactement l'un des deux. `cv_id` est optionnel : s'il est
        fourni, la lettre forme avec ce CV un Pack de candidature (la lettre est rédigée
        de façon cohérente avec la Variante) et, sauf valeur explicite, hérite de son
        `template_id` et de son `theme` (snapshotés dans la lettre). Il n'existe pas
        d'entité « Pack » : le Pack est le couple CV + Lettre partageant `job_offer_id`.

        `target_language` (défaut `fr`) pilote la RÉÉCRITURE dans la langue cible en
        visant l'offre. Le rattachement de la langue de la lettre à celle du CV (décision
        D7) reste OUVERT.

        Capacité premium : Pass actif requis (`402`). Une seule génération de lettre
        active par utilisateur à la fois (`409`, indépendante des générations de CV :
        un Pack peut être généré en parallèle).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateLetterRequest"
      responses:
        "202":
          description: Job de génération de lettre accepté
          headers:
            Location:
              description: URL de suivi du job (`/v1/jobs/{job_id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterJobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PassRequired"
        "404":
          description: Profil, CV (`cv_id`) ou offre (`job_offer_id`) introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/JobConflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /letters:
    get:
      tags: [Letters]
      operationId: listLetters
      summary: Lister les lettres de l'utilisateur courant
      description: |
        Retourne la liste paginée des lettres, sans le contenu complet. Le filtre
        `cv_id` retrouve la lettre assortie à un CV (Pack de candidature).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: cv_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Ne retourne que les lettres liées à ce CV
      responses:
        "200":
          description: Liste des lettres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LetterListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /letters/{letter_id}:
    get:
      tags: [Letters]
      operationId: getLetter
      summary: Obtenir le détail complet d'une lettre
      description: |
        Lecture d'un Document existant : gating par ownership uniquement, jamais par
        le Pass (la lettre reste consultable après expiration du Pass).
      parameters:
        - $ref: "#/components/parameters/letterIdPath"
      responses:
        "200":
          description: Lettre complète
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Letters]
      operationId: updateLetter
      summary: Mettre à jour le nom, le contenu ou l'enveloppe d'une lettre
      description: |
        Mise à jour PARTIELLE : seuls les champs fournis sont modifiés. Met à jour le
        nom (`letter_name`), le contenu (`letter_data_json`) et/ou l'enveloppe
        (`template_id`, `theme`, `language`). Changer l'enveloppe ne modifie jamais le
        contenu ; changer `language` ne traduit pas le contenu.

        Gating (Pass) : la lettre est une capacité premium ; son édition exige un Pass
        actif, sinon `402`. La lettre reste consultable et exportable sans Pass (D1).
      parameters:
        - $ref: "#/components/parameters/letterIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLetterRequest"
      responses:
        "200":
          description: Lettre mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PassRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [Letters]
      operationId: deleteLetter
      summary: Supprimer une lettre
      description: |
        Supprime la lettre et les fichiers exportés associés (PDF, docx) du bucket GCS.
        Suppression possible sans Pass actif (l'utilisateur maîtrise toujours ses données).
      parameters:
        - $ref: "#/components/parameters/letterIdPath"
      responses:
        "204":
          description: Lettre supprimée avec succès (aucun corps)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /letters/{letter_id}/export:
    post:
      tags: [Export]
      operationId: exportLetter
      summary: Lancer l'export asynchrone d'une lettre (PDF ou docx)
      description: |
        Lance la production d'un fichier téléchargeable de la lettre (`job_type` =
        `export`). Même mécanique que `POST /cv/{cv_id}/export` : `202` + `job_id`,
        polling via `GET /jobs/{job_id}`, puis `result.download_url` (URL de
        téléchargement backend — download proxifié, `result.expires_at`).

        Gating = ownership (décision D1) : exporter ou re-télécharger une lettre DÉJÀ
        POSSÉDÉE est autorisé sans Pass actif. Un seul export actif par utilisateur à
        la fois (`409`).
      parameters:
        - $ref: "#/components/parameters/letterIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Job d'export accepté
          headers:
            Location:
              description: URL de suivi du job (`/v1/jobs/{job_id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PassRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JobConflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------
  # Jobs (suivi asynchrone générique)
  # ---------------------------------------------------------------------------

  /jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getJobStatus
      summary: Consulter l'état d'un job asynchrone (tous types)
      description: |
        Retourne l'état courant d'un job, quel que soit son `job_type`
        (`cv_generation`, `letter_generation`, `export`, `review`) : `queued`,
        `running`, `succeeded` ou `failed`. Transitions : queued -> running ->
        succeeded | failed.

        - `queued` : en attente d'un worker.
        - `running` : traitement en cours ; `progress_pct` indique l'avancement (0-100).
        - `succeeded` : traitement terminé ; `result` désigne la ressource produite
          (`result_kind` + `result_id`). Pour un export, `result.download_url` et
          `result.expires_at` sont renseignés ; pour une relecture, `result.review`.
        - `failed` : le traitement a échoué ; `error_message` contient un message
          générique.

        Un job inconnu OU appartenant à un autre utilisateur répond `404` :
        aucun oracle d'existence (ADR-GATING). Un admin accède en support.
        Remplace `GET /cv/jobs/{job_id}` (déprécié).
      parameters:
        - $ref: "#/components/parameters/jobIdPath"
      responses:
        "200":
          description: État du job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{job_id}/download:
    get:
      tags: [Jobs]
      operationId: downloadJobResult
      summary: Télécharger le fichier produit par un job d'export (proxifié)
      description: |
        Renvoie le FICHIER produit par un job d'export `succeeded`
        (download PROXIFIÉ par le backend — ADR-EXPORT-DELIVERY : le bucket
        reste privé, l'ownership est revérifié à CHAQUE téléchargement). C'est
        la cible de `result.download_url`.

        Autorisé sans Pass (D1 : re-télécharger un document possédé n'est pas
        une action premium). Un job inconnu ou d'un autre utilisateur, un job
        non-export, ou un fichier purgé par la rétention répondent `404`
        (relancer l'export reproduit le fichier). Un job non encore `succeeded`
        répond `409`.
      parameters:
        - $ref: "#/components/parameters/jobIdPath"
      responses:
        "200":
          description: Le fichier exporté (binaire)
          headers:
            Content-Disposition:
              description: Pièce jointe (nom de fichier suggéré)
              schema:
                type: string
            Cache-Control:
              description: Donnée personnelle — jamais mise en cache
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/JobConflict"

  # ---------------------------------------------------------------------------
  # Billing
  # ---------------------------------------------------------------------------

  /billing/checkout-session:
    post:
      tags: [Billing]
      operationId: createCheckoutSession
      summary: Créer une session Stripe Checkout
      description: |
        Crée une session Stripe Checkout pour l'achat d'un CareerPass et retourne
        l'URL de redirection vers la page de paiement Stripe.

        Une fois le paiement validé côté Stripe, le webhook `/billing/webhook`
        reçoit l'événement `checkout.session.completed` et crée automatiquement
        un `CareerPass` pour l'utilisateur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionRequest"
      responses:
        "200":
          description: Session Stripe créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Type de pass invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Erreur Stripe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /billing/webhook:
    post:
      tags: [Billing]
      operationId: stripeWebhook
      summary: Webhook Stripe (endpoint public, non protégé par JWT)
      description: |
        Endpoint public non protégé par JWT. La signature Stripe est vérifiée via
        l'en-tête `Stripe-Signature` (secret `STRIPE_WEBHOOK_SECRET`).

        Événements traités :
        - `checkout.session.completed` : crée un `CareerPass` pour l'utilisateur
          identifié par `client_reference_id` (UUID utilisateur). La durée est déduite
          du `price_id` Stripe (`pass_type` = `PASS_30_DAYS` ou `PASS_90_DAYS`).

        Note : `stripe_payment_id` est nullable — les CareerPass créés par un admin
        (via seed/outil d'administration) n'ont pas de `stripe_payment_id`.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Signature HMAC calculée par Stripe (vérifiée côté serveur)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload brut de l'événement Stripe (non typé dans ce contrat)
      responses:
        "200":
          description: Webhook traité avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          description: Signature invalide ou payload malformé
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /billing/catalog:
    get:
      tags: [Billing]
      operationId: getBillingCatalog
      summary: Catalogue des Pass achetables
      description: |
        Liste les Pass proposés à l'achat avec leur prix. Le montant est lu en
        direct depuis Stripe (source unique de vérité) : `amount_cents` et
        `currency` peuvent être `null` si Stripe n'est pas configuré ou si la
        récupération échoue — dans ce cas le prix est confirmé à l'étape Checkout.
      responses:
        "200":
          description: Catalogue des Pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /billing/status:
    get:
      tags: [Billing]
      operationId: getBillingStatus
      summary: Statut d'accès (Pass actif ?)
      description: |
        Indique si l'utilisateur détient un CareerPass actuellement valide et,
        le cas échéant, jusqu'à quand.
      responses:
        "200":
          description: Statut d'accès de l'utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Account (RGPD Art. 17)
  # ---------------------------------------------------------------------------

  /users/me:
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Supprimer définitivement le compte (RGPD Art. 17)
      description: |
        Purge complète et irréversible de toutes les données personnelles :

        1. Suppression de tous les CV générés (table `generated_cvs`) et de toutes les
           lettres de motivation (table `cover_letters`).
        2. Suppression des fichiers associés (PDF, docx) dans le bucket GCS.
        3. Suppression du profil (table `user_profiles`).
        4. Suppression des CareerPasses (table `career_passes`).
        5. Suppression du compte utilisateur (table `users`).

        Exception : les factures (pièces comptables, conservation légale de 10 ans) ne
        sont pas détruites ; elles sont détachées du compte (référence utilisateur mise
        à `NULL`, jamais supprimées).

        Cette opération est irréversible. Le JWT de l'utilisateur est invalidé
        immédiatement après. Conforme au droit à l'effacement RGPD Article 17.
      responses:
        "204":
          description: Compte et toutes les données supprimés (aucun corps)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Administration (rôle admin uniquement)
  # ---------------------------------------------------------------------------

  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: Lister les comptes utilisateurs (admin uniquement)
      description: |
        Vue d'administration : tous les comptes avec leur état — email vérifié,
        pass actif (et son échéance), nombre de CV générés, nom issu du profil.
        Tri : inscriptions les plus récentes d'abord.

        Réservé au rôle `admin` : tout autre rôle reçoit `403`. Lecture seule —
        aucune action d'administration sur les comptes n'est exposée en V1.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Nombre maximum de comptes retournés
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Décalage de pagination
      responses:
        "200":
          description: Liste paginée des comptes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256, durée de vie 30 minutes. Obtenu via POST /v1/auth/login.

  parameters:
    cvIdPath:
      name: cv_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identifiant unique du CV

    letterIdPath:
      name: letter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identifiant unique de la lettre de motivation

    jobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identifiant du job asynchrone

  # ---------------------------------------------------------------------------
  # Réponses réutilisables
  # ---------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: JWT absent ou invalide
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://talentious.fr/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "Missing or invalid authentication token."
            instance: "/v1/auth/me"

    Forbidden:
      description: Accès refusé (ressource appartenant à un autre utilisateur)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://talentious.fr/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "You do not have permission to access this resource."
            instance: "/v1/cv/00000000-0000-0000-0000-000000000000"

    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://talentious.fr/errors/not-found"
            title: "Not Found"
            status: 404
            detail: "The requested resource was not found."
            instance: "/v1/cv/00000000-0000-0000-0000-000000000000"

    ValidationError:
      description: Erreur de validation du corps de la requête (Pydantic)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://talentious.fr/errors/validation-error"
            title: "Validation Error"
            status: 422
            detail: "Request body validation failed."
            instance: "/v1/profile"

    PassRequired:
      description: |
        Pass actif requis : la capacité demandée est premium et l'utilisateur n'a pas de
        CareerPass actif (le rôle `admin` n'est jamais concerné). Concerne la GÉNÉRATION
        et l'ÉDITION premium, jamais la lecture ni le re-téléchargement d'un document
        existant. Le champ `type` du Problem précise le motif :

        - `https://talentious.fr/errors/career-pass-required` : capacité premium sans
          autre précision (lettre, relecture, détail ATS, export docx, édition d'un
          document premium).
        - `https://talentious.fr/errors/premium-template-required` : Template non gratuit.
        - `https://talentious.fr/errors/premium-theme-required` : Thème CV personnalisé.
        - `https://talentious.fr/errors/premium-language-required` : langue `en`.
        - `https://talentious.fr/errors/variant-limit-reached` : une Variante de CV
          existe déjà (la gratuité en autorise une seule).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://talentious.fr/errors/career-pass-required"
            title: "Career Pass Required"
            status: 402
            detail: "An active Career Pass is required for this feature. Please purchase a pass."
            instance: "/v1/letters/generate"

    JobConflict:
      description: |
        Un job du même `job_type` est déjà actif (`queued` ou `running`) pour
        l'utilisateur courant. L'unicité s'applique par couple (utilisateur, `job_type`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://talentious.fr/errors/job-in-progress"
            title: "Job Already In Progress"
            status: 409
            detail: "A job of this type is already running for your account. Please wait for it to complete."
            instance: "/v1/cv/00000000-0000-0000-0000-000000000000/export"

  # ---------------------------------------------------------------------------
  # Schémas
  # ---------------------------------------------------------------------------
  schemas:
    # =========================================================================
    # RFC 7807 — Problem Details
    # =========================================================================
    Problem:
      type: object
      description: |
        Erreur au format RFC 7807 (application/problem+json).
        Aucune information interne (stack trace, str(e)) ne doit figurer
        dans `detail` en production.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: URI identifiant le type d'erreur
          example: "https://talentious.fr/errors/career-pass-required"
        title:
          type: string
          description: Titre court lisible par un humain
          example: "Career Pass Required"
        status:
          type: integer
          description: Code HTTP
          example: 402
        detail:
          type: string
          description: Explication détaillée, lisible par un humain (sans internals)
          example: "An active Career Pass is required to generate CVs."
        instance:
          type: string
          description: URI de la ressource ayant provoqué l'erreur
          example: "/v1/cv/generate"

    # =========================================================================
    # Auth
    # =========================================================================
    UserCreate:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: "alice@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Mot de passe en clair (haché côté serveur avec bcrypt)
          example: "S3cr3t!Pass"

    LoginForm:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          format: email
          description: Adresse email de l'utilisateur (champ `username` par convention OAuth2)
        password:
          type: string

    Token:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: JWT HS256
        token_type:
          type: string
          enum: [bearer]
          example: "bearer"

    UserResponse:
      type: object
      required:
        - id
        - email
        - role
        - is_active
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        email_verified:
          type: boolean
          description: L'adresse email a été confirmée (obligatoire pour se connecter)
        display_name:
          type: string
          nullable: true
          description: |
            Nom d'affichage (prénom du profil). Modifiable par l'utilisateur via
            son profil ; null si le profil n'a pas encore de prénom.
        stripe_customer_id:
          type: string
          nullable: true
          description: Identifiant client Stripe (null si jamais passé en caisse)
        has_password:
          type: boolean
          description: |
            false pour un compte créé via Google sans mot de passe : le client
            masque alors « changer le mot de passe » et oriente vers Google.

    UserRole:
      type: string
      enum: [USER, ADMIN]
      description: |
        - `USER` : rôle par défaut, soumis au contrôle CareerPass.
        - `ADMIN` : bypass du contrôle CareerPass, accès à toutes les ressources.

    # =========================================================================
    # Profile canonique — SOURCE DE VÉRITÉ
    # =========================================================================

    PersonalInfo:
      type: object
      description: |
        Informations personnelles du candidat. `first_name`, `last_name` et `email`
        sont les seuls champs requis. Tous les autres sont optionnels pour ne pas
        bloquer une création de profil partielle.
      required:
        - first_name
        - last_name
        - email
      properties:
        first_name:
          type: string
          maxLength: 100
          example: "Alice"
        last_name:
          type: string
          maxLength: 100
          example: "Dupont"
        email:
          type: string
          format: email
          example: "alice@example.com"
        phone:
          type: string
          nullable: true
          maxLength: 30
          example: "+33 6 12 34 56 78"
        linkedin:
          type: string
          nullable: true
          maxLength: 500
          example: "https://linkedin.com/in/alice-dupont"
        address:
          type: string
          nullable: true
          maxLength: 255
        city:
          type: string
          nullable: true
          maxLength: 100
          example: "Paris"
        postal_code:
          type: string
          nullable: true
          maxLength: 20
          example: "75001"
        country:
          type: string
          nullable: true
          maxLength: 100
          default: "France"
          example: "France"

    Experience:
      type: object
      description: Expérience professionnelle.
      required:
        - id
        - title
        - company
        - start_date
        - description
      properties:
        id:
          type: string
          description: Identifiant unique côté client (UUID v4 recommandé)
          example: "exp-001"
        title:
          type: string
          maxLength: 255
          example: "Ingénieur Logiciel Senior"
        company:
          type: string
          maxLength: 255
          example: "Acme Corp"
        location:
          type: string
          nullable: true
          maxLength: 255
          example: "Paris, France"
        start_date:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: Date de début au format YYYY-MM
          example: "2021-03"
        end_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: Date de fin au format YYYY-MM. Null si poste actuel.
          example: "2024-01"
        is_current:
          type: boolean
          default: false
          description: Indique si ce poste est le poste actuel. Si true, `end_date` doit être null.
        description:
          type: string
          maxLength: 5000
          description: Description du poste et des responsabilités
        achievements:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 500
          description: |
            Liste de réalisations concrètes et chiffrées.
            Transmis à l'agent rédacteur pour enrichir le CV généré.
          example:
            [
              "Réduit le temps de build CI de 40%",
              "Migré 3 services vers Kubernetes",
            ]

    Education:
      type: object
      description: |
        Formation académique. Renommage canonique : `field_of_study` (ancienne version
        frontend/backend Pydantic) est remplacé par `field` (nom unifié).
        Voir README.md pour le mapping des renommages.
      required:
        - id
        - degree
        - institution
      properties:
        id:
          type: string
          example: "edu-001"
        degree:
          type: string
          maxLength: 255
          example: "Master en Informatique"
        institution:
          type: string
          maxLength: 255
          example: "Université Paris-Saclay"
        location:
          type: string
          nullable: true
          maxLength: 255
        field:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Domaine d'étude. Remplace `field_of_study` (frontend TS, backend Pydantic).
            Renommage documenté dans README.md.
          example: "Intelligence Artificielle"
        start_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: Date de début, format YYYY-MM. Optionnelle.
          example: "2019-09"
        end_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: |
            Date de fin (obtention du diplôme), format YYYY-MM. Optionnelle.
            Remplace `graduation_date` dans la sortie agent (qui était requis, source de 422).
          example: "2021-06"
        description:
          type: string
          nullable: true
          maxLength: 2000
        grade:
          type: string
          nullable: true
          maxLength: 100
          example: "Mention Très Bien"

    Skills:
      type: object
      description: |
        Structure de compétences côté utilisateur (surface UI et backend).

        Décision de contrat : la structure `{hard: string[], soft: string[]}` est
        conservée comme format canonique unique. L'agent rédacteur reçoit cette même
        structure (plus de transformation runtime dans `cv.py`). L'agent n'a pas besoin
        de niveaux de compétence en entrée — il les infère du profil et de l'offre.
        Les niveaux apparaissent uniquement dans la sortie (`HighlightedSkill`).

        Limite : 20 compétences par catégorie (enforced par validation backend).
      required:
        - hard
        - soft
      properties:
        hard:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 20
          default: []
          example: ["Python", "FastAPI", "PostgreSQL", "Docker"]
        soft:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 20
          default: []
          example: ["Leadership", "Communication", "Résolution de problèmes"]

    Project:
      type: object
      description: Projet personnel ou professionnel.
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
          example: "proj-001"
        name:
          type: string
          maxLength: 255
          example: "Talentious"
        description:
          type: string
          maxLength: 3000
          example: "Plateforme SaaS de génération de CV assistée par IA"
        role:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Rôle tenu dans le projet. Présent dans le backend et le frontend ;
            était absent dans l'agent rédacteur (champ perdu). Désormais inclus
            dans le contrat canonique et transmis à l'agent.
          example: "Tech Lead & Développeur Principal"
        url:
          type: string
          nullable: true
          maxLength: 500
          example: "https://github.com/acme/talentious"
        start_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          example: "2023-01"
        end_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          example: "2024-06"
        technologies:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 100
          example: ["FastAPI", "Next.js", "Vertex AI"]

    Certification:
      type: object
      description: |
        Certification professionnelle.

        Renommage canonique : `issuing_organization` (frontend TS, backend Pydantic)
        devient `issuer`. Voir README.md pour le mapping des renommages.

        Tous les champs sauf `id`, `name` et `issuer` sont optionnels pour éviter
        les erreurs 422 sur des profils sans dates ou URLs de certification.
      required:
        - id
        - name
        - issuer
      properties:
        id:
          type: string
          example: "cert-001"
        name:
          type: string
          maxLength: 255
          example: "AWS Certified Solutions Architect"
        issuer:
          type: string
          maxLength: 255
          description: |
            Organisation émettrice. Remplace `issuing_organization` (frontend/backend).
            L'agent rédacteur utilisait déjà `issuer` — c'est ce nom qui est retenu.
          example: "Amazon Web Services"
        issue_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: Date d'obtention, format YYYY-MM. Optionnelle.
          example: "2023-04"
        expiration_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: |
            Date d'expiration, format YYYY-MM. Null si pas d'expiration.
            Présent dans frontend/backend ; était absent côté agent (champ perdu).
          example: "2026-04"
        credential_id:
          type: string
          nullable: true
          maxLength: 255
          example: "ABC-123456"
        credential_url:
          type: string
          nullable: true
          maxLength: 500
          description: |
            URL de vérification de la certification.
            Était présent dans frontend/backend, absent côté agent (champ perdu).
          example: "https://www.credly.com/badges/abc-123"

    Language:
      type: object
      description: |
        Maîtrise linguistique. Ce champ était présent dans l'agent rédacteur mais
        jamais transmis depuis le backend (absent du profil backend/frontend).
        Il est désormais inclus dans le ProfileData canonique.
      required:
        - name
        - level
      properties:
        name:
          type: string
          maxLength: 100
          example: "Anglais"
        level:
          type: string
          maxLength: 100
          description: |
            Niveau de maîtrise. Valeurs recommandées (non exhaustives) :
            Natif, Courant, Avancé, Intermédiaire, Débutant.
          example: "Courant"

    ProfileData:
      type: object
      description: |
        Modèle de profil canonique unique — SOURCE DE VÉRITÉ.

        Ce schéma est la référence pour : backend I/O (routes `/profile`), entrée
        de l'agent rédacteur-cv, et extraction partielle par le parser-pdf.
        Les types Pydantic (backend) et TypeScript (frontend) sont GÉNÉRÉS depuis
        ce schéma via openapi-generator. Ne jamais modifier le code sans mettre
        ce contrat à jour d'abord.
      required:
        - personal_info
        - summary
        - skills
      properties:
        personal_info:
          $ref: "#/components/schemas/PersonalInfo"
        summary:
          type: string
          maxLength: 2000
          description: Résumé professionnel libre
          example: "Ingénieure logiciel passionnée par l'IA et les systèmes distribués."
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
          default: []
        educations:
          type: array
          items:
            $ref: "#/components/schemas/Education"
          default: []
        skills:
          $ref: "#/components/schemas/Skills"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/Language"
          default: []
          description: |
            Langues parlées. Était présent dans l'agent rédacteur mais jamais
            transmis depuis le backend. Désormais inclus dans le profil canonique.
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
          default: []
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/Certification"
          default: []

    ProfileResponse:
      type: object
      required:
        - user_id
        - profile_data
        - updated_at
      properties:
        user_id:
          type: string
          format: uuid
        profile_data:
          $ref: "#/components/schemas/ProfileData"
        updated_at:
          type: string
          format: date-time
          description: Horodatage UTC de la dernière mise à jour

    ProfileUpdate:
      type: object
      required:
        - profile_data
      properties:
        profile_data:
          $ref: "#/components/schemas/ProfileData"

    # =========================================================================
    # CV — Génération asynchrone (Job)
    # =========================================================================

    GenerateCVRequest:
      type: object
      required:
        - cv_name
        - offer_text
      properties:
        cv_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Nom donné par l'utilisateur à ce CV
          example: "CV - Ingénieur Backend Acme"
        offer_text:
          type: string
          minLength: 50
          maxLength: 200000
          description: |
            Texte brut de l'offre d'emploi. La borne haute (200 000 caractères)
            est alignée sur la limite de l'agent analyseur.
          example: "Nous recherchons un ingénieur backend senior maîtrisant Python et FastAPI..."
        template_id:
          type: string
          minLength: 1
          maxLength: 64
          default: "modern_sobre"
          description: |
            Identifiant du Template (voir `GET /cv/templates`). Défaut : le Template
            gratuit `modern_sobre`. Un Template premium sans Pass actif répond `402`
            (`premium-template-required`) ; un identifiant inconnu répond `422`.
            Enveloppe du document : jamais intégré au contenu.
          example: "modern_sobre"
        theme:
          allOf:
            - $ref: "#/components/schemas/CVTheme"
          description: |
            Thème CV INLINE (preset de `GET /cv/themes`, éventuellement modifié).
            Optionnel : omis, le Thème CV par défaut du Template s'applique. Le thème
            est SNAPSHOTÉ dans le CV généré. Un thème personnalisé sans Pass actif
            répond `402` (`premium-theme-required`).
        target_language:
          allOf:
            - $ref: "#/components/schemas/DocumentLanguage"
          default: fr
          description: |
            Langue du document. Le contenu est RÉÉCRIT dans cette langue en visant
            l'offre (pas de traduction littérale ; décision D7 ouverte sur le périmètre
            exact). `en` sans Pass actif répond `402` (`premium-language-required`).
            Enregistrée dans l'enveloppe du CV (`language`).

    GenerateCVJobAccepted:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          format: uuid
          description: Identifiant du job de génération
        status:
          type: string
          enum: [queued]
          example: "queued"
        message:
          type: string
          example: "CV generation job accepted. Poll GET /v1/jobs/{job_id} for status."

    CVJobStatus:
      type: object
      required:
        - job_id
        - status
        - created_at
      description: |
        Etat d'un job de génération de CV. Transitions : queued -> running -> succeeded | failed.
        Schéma de l'alias déprécié `GET /cv/jobs/{job_id}` ; préférer `JobStatus`.
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed]
          description: |
            - `queued` : en attente d'un worker.
            - `running` : traitement IA en cours.
            - `succeeded` : CV généré, `cv_id` renseigné.
            - `failed` : génération échouée, relancer via POST /cv/generate.
        progress_pct:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Avancement (0-100). Renseigné uniquement pour le statut `running`.
          example: 55
        cv_id:
          type: string
          nullable: true
          format: uuid
          description: Identifiant du CV créé. Renseigné uniquement si statut = `succeeded`.
        error_message:
          type: string
          nullable: true
          description: |
            Message d'erreur générique (sans internals). Renseigné uniquement si statut = `failed`.
          example: "CV generation failed. Please try again."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          nullable: true
          format: date-time

    # =========================================================================
    # Administration
    # =========================================================================

    AdminUserItem:
      type: object
      required:
        - id
        - email
        - role
        - email_verified
        - created_at
        - has_active_pass
        - cv_count
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
          nullable: true
          description: Prénom + nom issus du profil (null si profil vide)
          example: "Yanis Benali"
        role:
          type: string
          enum: [user, admin]
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: Date d'inscription
        has_active_pass:
          type: boolean
        pass_valid_until:
          type: string
          nullable: true
          format: date-time
          description: Échéance du pass actif (null si aucun)
        cv_count:
          type: integer
          minimum: 0
          description: Nombre de CV générés par ce compte

    AdminUsersResponse:
      type: object
      required:
        - total
        - users
      properties:
        total:
          type: integer
          minimum: 0
          description: Nombre total de comptes (indépendant de la pagination)
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserItem"

    # =========================================================================
    # Profil — Import asynchrone (brouillon éphémère, jamais persisté)
    # =========================================================================

    ImportJobAccepted:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          format: uuid
          description: Identifiant du job d'import
        status:
          type: string
          enum: [running]
          example: "running"
        message:
          type: string
          example: "Import job accepted. Poll GET /v1/profile/import-cv/jobs/{job_id} for status."

    ImportJobStatus:
      type: object
      required:
        - job_id
        - status
      description: |
        État d'un job d'import de CV. Transitions : running -> succeeded | failed.
        Job éphémère (mémoire serveur, ≤ 15 min) — un job expiré répond 404.
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, succeeded, failed]
          description: |
            - `running` : extraction en cours (20-60 s typiquement).
            - `succeeded` : brouillon prêt, `profile_data` et `warnings` renseignés.
            - `failed` : import échoué, `error_message` renseigné ; relancer via POST /profile/import-cv.
        profile_data:
          allOf:
            - $ref: "#/components/schemas/ProfileData"
          description: Brouillon extrait (non persisté). Présent uniquement si statut = `succeeded` (omis sinon).
        warnings:
          type: array
          nullable: true
          items:
            type: string
          description: Avertissements de relecture (troncature, sections non détectées…). Renseigné si statut = `succeeded`.
        error_message:
          type: string
          nullable: true
          description: Cause de l'échec, affichable à l'utilisateur. Renseigné uniquement si statut = `failed`.
          example: "Ce PDF ne contient pas de texte extractible (document scanné ?)"

    # =========================================================================
    # CV — CRUD
    # =========================================================================

    CVListItem:
      type: object
      required:
        - id
        - cv_name
        - template_id
        - theme
        - language
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        cv_name:
          type: string
        template_id:
          type: string
          description: Identifiant du Template (voir `CVTemplate.id`). Enveloppe du document.
          example: "modern_sobre"
        theme:
          allOf:
            - $ref: "#/components/schemas/CVTheme"
          description: Snapshot du Thème CV appliqué à ce CV (enveloppe du document).
        language:
          $ref: "#/components/schemas/DocumentLanguage"
        job_offer_id:
          type: string
          nullable: true
          format: uuid
          description: Offre à laquelle cette Variante est liée. Null si non liée.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CVDetailResponse:
      type: object
      description: |
        Variante de CV complète : ENVELOPPE (`template_id`, `theme`, `language`) +
        CONTENU canonique (`cv_data_json`, schéma `GeneratedCVData`). Le contenu ne
        porte aucune information de forme.
      required:
        - id
        - cv_name
        - template_id
        - theme
        - language
        - cv_data_json
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        cv_name:
          type: string
        template_id:
          type: string
          description: Identifiant du Template (voir `CVTemplate.id`). Enveloppe du document.
          example: "modern_sobre"
        theme:
          allOf:
            - $ref: "#/components/schemas/CVTheme"
          description: |
            Snapshot du Thème CV appliqué (objet stocké avec le document, pas une
            référence mutable : modifier un preset n'altère jamais un document existant).
        language:
          $ref: "#/components/schemas/DocumentLanguage"
        job_offer_id:
          type: string
          nullable: true
          format: uuid
          description: Offre à laquelle cette Variante est liée. Null si non liée.
        job_offer_context:
          type: string
          nullable: true
          description: Texte de l'offre d'emploi utilisée pour la génération
        cv_data_json:
          $ref: "#/components/schemas/GeneratedCVData"
        is_editable:
          type: boolean
          description: |
            Calculé à la lecture (jamais persisté) : true si le Pass est actif ou si le
            document est entièrement gratuit. false = lecture et téléchargement seuls
            (décision D1) ; une édition premium répondrait `402`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateCVRequest:
      type: object
      description: |
        Tous les champs sont optionnels ; au moins un doit être fourni. Le contenu
        (`cv_data_json`) et l'enveloppe (`template_id`, `theme`, `language`) sont
        indépendants : modifier l'un ne modifie jamais l'autre.
      properties:
        cv_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
        cv_data_json:
          $ref: "#/components/schemas/GeneratedCVData"
        template_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Nouveau Template. Premium sans Pass actif : `402`
            (`premium-template-required`) ; identifiant inconnu : `422`.
          example: "modern_sobre"
        theme:
          allOf:
            - $ref: "#/components/schemas/CVTheme"
          description: |
            Nouveau Thème CV (inline, snapshoté). Personnalisé sans Pass actif : `402`
            (`premium-theme-required`).
        language:
          allOf:
            - $ref: "#/components/schemas/DocumentLanguage"
          description: |
            Nouvelle langue de RENDU (titres de section, mois). Ne traduit pas le contenu.
            `en` sans Pass actif : `402` (`premium-language-required`).

    # =========================================================================
    # Sortie agent rédacteur — GeneratedCVData
    # =========================================================================

    GeneratedCVData:
      type: object
      description: |
        SCHÉMA DE CONTENU CANONIQUE UNIQUE du CV (ADR-CONTENT-SCHEMA). Ce schéma est à
        la fois : la sortie de l'agent rédacteur-cv, la charge utile stockée en JSONB
        (`generated_cvs.cv_data_json`), l'entrée du package de rendu partagé
        (`@talentious/cv-render`, côté export-service et aperçu) et le modèle d'édition
        (`PUT /cv/{cv_id}`). Aucune transformation runtime entre ces usages (seule la
        coercition de sécurité en liste blanche s'applique avant stockage).

        Contenu PUR : aucune information de forme. `template_id`, `theme` et `language`
        vivent dans l'enveloppe du document (`CVDetailResponse`), jamais ici : le contenu
        est portable d'un Template à l'autre.

        Contrainte : aucun champ date n'est requis dans les sous-schémas de sortie
        (`SelectedEducation`, `SelectedCertification`) pour éviter les 422 aléatoires
        lorsque l'IA ne génère pas ces dates.
      required:
        - personal_info
        - summary
        - selected_experiences
        - highlighted_skills
        - selected_educations
      properties:
        personal_info:
          $ref: "#/components/schemas/PersonalInfo"
        summary:
          type: string
          maxLength: 2000
          description: Résumé professionnel réécrit et optimisé pour l'offre (50-120 mots)
        selected_experiences:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/SelectedExperience"
          description: Expériences sélectionnées et réécrites (3-5 les plus pertinentes)
        highlighted_skills:
          type: array
          items:
            $ref: "#/components/schemas/HighlightedSkill"
          maxItems: 30
          description: Compétences priorisées pour l'offre (8-15)
        selected_educations:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/SelectedEducation"
        selected_projects:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/SelectedProject"
          default: []
        selected_certifications:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/SelectedCertification"
          default: []
        optimization_notes:
          type: string
          nullable: true
          description: |
            Notes internes de l'agent sur sa stratégie d'optimisation.
            NE DOIT PAS être affiché à l'utilisateur final ni loggé en production
            (risque BLK-5 : exfiltration de données via prompt injection).

    SelectedExperience:
      type: object
      required:
        - id
        - title
        - company
        - start_date
        - description
        - highlighted_skills
      properties:
        id:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 255
        company:
          type: string
          maxLength: 255
        start_date:
          type: string
          pattern: '^\d{4}-\d{2}$'
        end_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
        location:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          maxLength: 5000
          description: Description réécrite avec verbes d'action et mots-clés de l'offre
        highlighted_skills:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 100
          description: Compétences démontrées dans cette expérience, pertinentes pour l'offre

    HighlightedSkill:
      type: object
      required:
        - name
        - category
        - importance
      properties:
        name:
          type: string
          maxLength: 100
        level:
          type: string
          nullable: true
          maxLength: 100
          description: Niveau de maîtrise inféré par l'agent (ex. Expert, Intermédiaire)
        category:
          type: string
          enum: [hard_skill, soft_skill]
        importance:
          type: string
          enum: [Critical, Important, "Nice to have"]
          description: Importance de la compétence pour l'offre ciblée

    SelectedEducation:
      type: object
      required:
        - id
        - degree
        - institution
      description: |
        Formation sélectionnée par l'agent. `end_date` est optionnel
        (était requis dans l'ancienne version — source de 422 aléatoires).
      properties:
        id:
          type: string
          maxLength: 64
        degree:
          type: string
          maxLength: 255
        institution:
          type: string
          maxLength: 255
        end_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: |
            Date d'obtention du diplôme, format YYYY-MM. Optionnelle.
            Remplace `graduation_date: str` (requis dans l'ancienne version agent).
        description:
          type: string
          nullable: true
          maxLength: 2000

    SelectedProject:
      type: object
      required:
        - id
        - name
        - description
        - relevant_skills
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 3000
        url:
          type: string
          nullable: true
          maxLength: 500
        completion_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
        relevant_skills:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 100

    SelectedCertification:
      type: object
      required:
        - id
        - name
        - issuer
      description: |
        Certification sélectionnée par l'agent. `issue_date` est optionnel
        (était requis dans l'ancienne version — source de 422 aléatoires).
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        issuer:
          type: string
          maxLength: 255
        issue_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: |
            Date d'obtention. Optionnelle.
            Remplace `issue_date: str` (requis dans l'ancienne version agent).
        url:
          type: string
          nullable: true
          maxLength: 500

    # =========================================================================
    # V2 — Templates, Thèmes CV, langue du document
    # =========================================================================

    DocumentLanguage:
      type: string
      enum: [fr, en]
      description: |
        Langue du document (CV ou lettre), distincte de la langue de l'interface (qui
        reste française). Uniquement `fr` et `en`. `en` est une capacité premium.

    TemplateSector:
      type: string
      enum: [modern, corporate, tech, academic, creative]
      description: |
        Secteur / persona auquel un Template est destiné (Bible V2, §2 et §3.1) :
        - `modern` : moderne / simple (jeunes diplômés, reconversion) ; inclut
          « Moderne sobre », Template gratuit neutre.
        - `corporate` : corporate / sobre (reconversion, cadres).
        - `tech` : tech (reconversion, freelances).
        - `academic` : académique (cadres, profils expérimentés).
        - `creative` : créatif (freelances).

    CVTemplate:
      type: object
      description: |
        Template : mise en page prédéfinie d'un CV ou d'une lettre (structure,
        hiérarchie, éléments graphiques disponibles). Ne définit ni les couleurs ni les
        polices choisies par l'utilisateur (voir `CVTheme`). S'applique à un CV et à sa
        lettre assortie.
      required:
        - id
        - name
        - sector
        - is_free
        - description
        - preview_url
      properties:
        id:
          type: string
          description: Identifiant stable du Template, valeur de `template_id` dans les documents
          example: "modern_sobre"
        name:
          type: string
          example: "Moderne sobre"
        sector:
          $ref: "#/components/schemas/TemplateSector"
        is_free:
          type: boolean
          description: |
            true si le Template est utilisable sans Pass actif. Un seul Template gratuit
            est prévu (« Moderne sobre »).
          example: true
        description:
          type: string
          example: "Mise en page sobre et neutre, adaptée à tous les secteurs."
        preview_url:
          type: string
          format: uri
          description: URL de l'aperçu statique du Template
          example: "https://app.talentious.fr/templates/modern_sobre.png"
        default_theme_id:
          type: string
          nullable: true
          description: |
            Identifiant du preset de Thème CV (`CVTheme.id`) appliqué par défaut si
            aucun thème n'est fourni. Null si aucun thème par défaut n'est référencé.
          example: "anthracite"

    CVFontFamily:
      type: string
      enum:
        - "Inter"
        - "Source Sans 3"
        - "IBM Plex Sans"
        - "Work Sans"
        - "Source Serif 4"
        - "Lora"
        - "Merriweather"
        - "IBM Plex Serif"
      description: |
        Liste BLANCHE des polices autorisées dans un Thème CV (jeu curaté, embarqué côté
        service d'export : déterminisme du rendu, résidence UE, défense anti-injection
        CSS). Aucune autre valeur n'est acceptée. La liste exacte doit rester alignée sur
        le manifeste de polices embarquées du package de rendu (à confirmer avant
        implémentation).

    HexColor:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      description: Couleur au format hexadécimal strict `#RRGGBB` (défense anti-injection CSS).
      example: "#2D3748"

    CVThemeTokens:
      type: object
      description: |
        Jetons de style CV-scopés (injectés en propriétés CSS propres au CV, jamais les
        couleurs de l'interface de l'application). Validation STRICTE : couleurs en
        `#RRGGBB`, polices dans la liste blanche `CVFontFamily`, aucune propriété
        supplémentaire acceptée. Le serveur vérifie en plus un contraste de lisibilité
        suffisant (texte / fond) avant enregistrement ; un thème illisible répond `422`
        (seuil exact fixé côté serveur).
      additionalProperties: false
      required:
        - color_accent
        - color_text
        - color_muted
        - color_background
        - font_heading
        - font_body
      properties:
        color_accent:
          $ref: "#/components/schemas/HexColor"
        color_text:
          $ref: "#/components/schemas/HexColor"
        color_muted:
          $ref: "#/components/schemas/HexColor"
        color_background:
          $ref: "#/components/schemas/HexColor"
        font_heading:
          $ref: "#/components/schemas/CVFontFamily"
        font_body:
          $ref: "#/components/schemas/CVFontFamily"

    CVTheme:
      type: object
      description: |
        Thème CV : choix de style (couleurs, polices) appliqué PAR-DESSUS un Template.
        Les données du thème sont envoyées INLINE à la génération ou à l'édition et
        SNAPSHOTÉES dans le document (aucune clé étrangère vers un preset mutable : un
        document existant n'est jamais altéré par l'évolution d'un preset).

        Les `tokens` font foi. `id` n'est qu'informatif (provenance d'un preset). Un
        thème dont les `tokens` diffèrent du preset désigné par `id` est un thème
        personnalisé (premium).
      required:
        - name
        - tokens
      properties:
        id:
          type: string
          nullable: true
          maxLength: 64
          description: Identifiant du preset d'origine (`GET /cv/themes`). Null pour un thème personnalisé.
          example: "anthracite"
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: "Anthracite"
        tokens:
          $ref: "#/components/schemas/CVThemeTokens"
        is_free:
          type: boolean
          readOnly: true
          description: |
            Renseigné par le serveur sur les presets : true si le preset est utilisable
            sans Pass actif. Ignoré en entrée.

    # =========================================================================
    # V2 — Jobs généralisés
    # =========================================================================

    JobType:
      type: string
      enum: [cv_generation, letter_generation, export, review]
      description: |
        Nature du traitement asynchrone :
        - `cv_generation` : génération d'un CV (`POST /cv/generate`).
        - `letter_generation` : génération d'une lettre (`POST /letters/generate`).
        - `export` : production d'un fichier PDF ou docx (`POST .../export`).
        - `review` : Relecture IA (`POST /cv/{cv_id}/review`).
        Unicité : un seul job actif par couple (utilisateur, `job_type`).

    JobResultKind:
      type: string
      enum: [cv, letter, export, review]
      description: |
        Nature de la ressource produite par un job `succeeded`. Correspondance :
        `cv_generation` -> `cv`, `letter_generation` -> `letter`, `export` -> `export`,
        `review` -> `review`.

    JobResult:
      type: object
      description: |
        Ressource produite par un job `succeeded`. `result_id` désigne : le `cv_id`
        (`cv`), le `letter_id` (`letter`), l'identifiant du fichier produit (`export`),
        l'identifiant de la relecture (`review`).
      required:
        - result_kind
        - result_id
      properties:
        result_kind:
          $ref: "#/components/schemas/JobResultKind"
        result_id:
          type: string
          format: uuid
          description: |
            Identifiant de la ressource produite : le CV (`cv`), la lettre
            (`letter`), ou — pour un `export` — le CV SOURCE exporté (le fichier
            lui-même se récupère via `download_url`, pas par cet id).
        download_url:
          type: string
          nullable: true
          description: |
            CHEMIN de téléchargement RELATIF à l'API (ex. `/jobs/{id}/download`),
            servi par le BACKEND (download proxifié : authentification +
            ownership revérifiés à chaque accès, le bucket reste privé —
            ADR-EXPORT-DELIVERY, R2 tranché ; relatif car le client appelle la
            même origine que l'API). Renseigné uniquement si `result_kind` =
            `export`.
        expires_at:
          type: string
          nullable: true
          format: date-time
          description: |
            Horizon de disponibilité du fichier (politique de rétention du
            stockage). Un fichier purgé se renouvelle en relançant l'export
            (le fichier à jour est resservi sans nouveau rendu). Null = pas
            d'expiration programmée. Renseignée uniquement si `result_kind`
            = `export`.
        review:
          allOf:
            - $ref: "#/components/schemas/ReviewResult"
          description: Résultat de la relecture. Présent uniquement si `result_kind` = `review` (omis sinon).

    JobStatus:
      type: object
      required:
        - job_id
        - job_type
        - status
        - created_at
      description: |
        État d'un job asynchrone, tous types confondus. Transitions :
        queued -> running -> succeeded | failed. Généralise `CVJobStatus`.
      properties:
        job_id:
          type: string
          format: uuid
        job_type:
          $ref: "#/components/schemas/JobType"
        status:
          type: string
          enum: [queued, running, succeeded, failed]
          description: |
            - `queued` : en attente d'un worker.
            - `running` : traitement en cours.
            - `succeeded` : traitement terminé, `result` renseigné.
            - `failed` : traitement échoué, `error_message` renseigné ; relancer l'opération.
        progress_pct:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Avancement (0-100). Renseigné uniquement pour le statut `running`.
          example: 55
        result:
          allOf:
            - $ref: "#/components/schemas/JobResult"
          description: Ressource produite. Présent uniquement si statut = `succeeded` (omis sinon).
        error_message:
          type: string
          nullable: true
          description: |
            Message d'erreur générique (sans internals). Renseigné uniquement si statut = `failed`.
          example: "Job failed. Please try again."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          nullable: true
          format: date-time

    # =========================================================================
    # V2 — Score ATS
    # =========================================================================

    ATSKeyword:
      type: object
      description: |
        Mot-clé issu de l'Analyse d'offre (forme identique à la sortie `keywords` de
        l'agent analyseur-offre), utilisé pour le matching ATS déterministe.
      required:
        - name
        - category
      properties:
        name:
          type: string
          maxLength: 100
          example: "Python"
        category:
          type: string
          enum: [hard_skill, soft_skill, requirement]
          description: |
            - `hard_skill` : compétence technique, outil, langage.
            - `soft_skill` : compétence comportementale.
            - `requirement` : exigence non-compétence (diplôme, certification, séniorité, langue).
        importance:
          type: string
          nullable: true
          enum: [Critical, Important, "Nice to have"]
        aliases:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 5
          default: []
          description: Variantes et synonymes reconnus lors du matching (ex. « JS » pour « JavaScript »)

    ATSScoreRequest:
      type: object
      description: |
        Offre face à laquelle le CV est évalué. Fournir EXACTEMENT UN des deux champs
        `offer_text` ou `job_offer_id` ; fournir les deux ou aucun répond `422`.
      properties:
        offer_text:
          type: string
          minLength: 50
          maxLength: 200000
          description: Texte brut de l'offre d'emploi (même bornes que `GenerateCVRequest.offer_text`)
          example: "Nous recherchons un ingénieur backend senior maîtrisant Python et FastAPI..."
        job_offer_id:
          type: string
          format: uuid
          description: Identifiant d'une Offre déjà enregistrée (retourné par un score ou une génération précédente)

    ATSScoreResult:
      type: object
      required:
        - cv_id
        - job_offer_id
        - score
        - matched_keywords
        - missing_keywords
        - missing_keywords_count
        - detail_truncated
      description: |
        Résultat du Score ATS. Indicateur d'aide, non une garantie de passage dans un
        outil de recrutement réel (formulation exacte de l'avertissement : décision D10
        ouverte).
      properties:
        cv_id:
          type: string
          format: uuid
        job_offer_id:
          type: string
          format: uuid
          description: Offre évaluée (réutilisable dans les requêtes suivantes)
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Score d'adéquation (0-100). Déterministe et reproductible. Toujours renseigné, y compris sans Pass.
          example: 54
        matched_keywords:
          type: array
          items:
            $ref: "#/components/schemas/ATSKeyword"
          description: Mots-clés de l'offre présents dans le CV. Partiel ou vide si `detail_truncated` = true.
        missing_keywords:
          type: array
          items:
            $ref: "#/components/schemas/ATSKeyword"
          description: Mots-clés manquants. Partiel ou vide si `detail_truncated` = true.
        missing_keywords_count:
          type: integer
          minimum: 0
          description: Nombre total de mots-clés manquants, même si la liste est tronquée (teaser gratuit)
          example: 7
        detail_truncated:
          type: boolean
          description: |
            true si le serveur a tronqué le détail pour le palier gratuit (pas de Pass
            actif). Le plafond exact de ce que le palier gratuit voit est une décision
            produit ouverte (D3) : il n'est pas figé par ce contrat.

    # =========================================================================
    # V2 — Export
    # =========================================================================

    ExportFormat:
      type: string
      enum: [pdf, docx]
      description: |
        Format du fichier exporté. `pdf` : rendu serveur fidèle et déterministe.
        `docx` : fichier Word éditable produit depuis le contenu structuré, mise en forme
        simplifiée (fidélité exacte au PDF : décision D8 ouverte). `docx` est premium à
        la première production (voir `POST /cv/{cv_id}/export`).

    ExportRequest:
      type: object
      required:
        - format
      properties:
        format:
          $ref: "#/components/schemas/ExportFormat"

    ExportJobAccepted:
      type: object
      required:
        - job_id
        - job_type
        - status
        - format
      properties:
        job_id:
          type: string
          format: uuid
          description: Identifiant du job d'export
        job_type:
          type: string
          enum: [export]
          example: "export"
        status:
          type: string
          enum: [queued]
          example: "queued"
        format:
          $ref: "#/components/schemas/ExportFormat"
        message:
          type: string
          example: "Export job accepted. Poll GET /v1/jobs/{job_id} for status."

    # =========================================================================
    # V2 — Relecture IA
    # =========================================================================

    ReviewSeverity:
      type: string
      enum: [info, warning, critical]
      description: |
        Gravité d'une suggestion :
        - `info` : amélioration optionnelle.
        - `warning` : amélioration recommandée.
        - `critical` : défaut qui nuit nettement au CV (incohérence, faute marquée).

    ReviewSection:
      type: string
      enum:
        - personal_info
        - summary
        - experiences
        - skills
        - educations
        - projects
        - certifications
        - global
      description: |
        Section du contenu (`GeneratedCVData`) visée par la suggestion ; `global` pour
        une remarque transversale. La portée de la relecture (contenu seul ou aussi la
        forme) est la décision produit D9, OUVERTE : en l'état, seules des sections de
        contenu sont couvertes.

    ReviewSuggestion:
      type: object
      required:
        - id
        - section
        - severity
        - message
      properties:
        id:
          type: string
          maxLength: 64
          description: Identifiant de la suggestion, unique au sein d'une relecture (suivi accepter / refuser côté client)
          example: "s1"
        section:
          $ref: "#/components/schemas/ReviewSection"
        target_id:
          type: string
          nullable: true
          description: |
            Identifiant de l'élément visé dans la section (ex. `id` d'une
            `SelectedExperience`). Null pour une suggestion portant sur toute la section.
        severity:
          $ref: "#/components/schemas/ReviewSeverity"
        message:
          type: string
          maxLength: 1000
          description: Constat expliqué à l'utilisateur
          example: "Le résumé ne mentionne pas vos 5 ans d'expérience en backend."
        suggestion:
          type: string
          nullable: true
          maxLength: 5000
          description: Texte de remplacement proposé. Null si le constat n'appelle pas de réécriture. Jamais appliqué sans validation.

    ReviewResult:
      type: object
      required:
        - review_id
        - cv_id
        - suggestions
      description: |
        Résultat d'une Relecture IA. Les suggestions ne modifient jamais le CV : le
        client les propose à l'utilisateur, qui accepte ou refuse chacune, puis
        enregistre le CV via `PUT /cv/{cv_id}`.
      properties:
        review_id:
          type: string
          format: uuid
        cv_id:
          type: string
          format: uuid
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ReviewSuggestion"

    ReviewJobAccepted:
      type: object
      required:
        - job_id
        - job_type
        - status
      properties:
        job_id:
          type: string
          format: uuid
          description: Identifiant du job de relecture
        job_type:
          type: string
          enum: [review]
          example: "review"
        status:
          type: string
          enum: [queued]
          example: "queued"
        message:
          type: string
          example: "Review job accepted. Poll GET /v1/jobs/{job_id} for status."

    # =========================================================================
    # V2 — Lettre de motivation
    # =========================================================================

    LetterTone:
      type: string
      enum: [formal, balanced, dynamic]
      description: |
        Ton souhaité pour la lettre : `formal` (solennel), `balanced` (équilibré, valeur
        par défaut côté serveur), `dynamic` (enthousiaste, direct). Liste provisoire,
        extensible sans rupture.

    CoverLetterRecipient:
      type: object
      description: Destinataire de la lettre. Tous les champs sont optionnels (une offre n'en précise pas toujours).
      properties:
        name:
          type: string
          nullable: true
          maxLength: 200
          description: Nom du destinataire (ex. responsable du recrutement)
        title:
          type: string
          nullable: true
          maxLength: 200
        company:
          type: string
          nullable: true
          maxLength: 200
          example: "Acme Corp"
        address:
          type: string
          nullable: true
          maxLength: 500

    CoverLetterSignature:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
          example: "Alice Dupont"
        title:
          type: string
          nullable: true
          maxLength: 200
          description: Fonction ou intitulé affiché sous le nom, si pertinent

    CoverLetterContent:
      type: object
      description: |
        SCHÉMA DE CONTENU CANONIQUE UNIQUE de la lettre (équivalent de `GeneratedCVData`) :
        sortie de l'agent rédacteur-cv (opération de génération de lettre), charge utile
        stockée en JSONB, entrée du rendu (PDF/docx) et modèle d'édition. Aucune
        transformation entre ces usages (hors coercition de sécurité en liste blanche).

        Contenu PUR : texte brut uniquement, aucun HTML ni information de forme.
        `template_id`, `theme` et `language` vivent dans l'enveloppe
        (`LetterDetailResponse`). `place` et `date` sont laissés à null par l'agent ; le
        serveur renseigne `date` à la création (jamais le LLM) et l'utilisateur peut les
        modifier. Null : la ligne est omise au rendu (rendu déterministe).
      required:
        - personal_info
        - recipient
        - salutation
        - body
        - closing
        - signature
      properties:
        personal_info:
          $ref: "#/components/schemas/PersonalInfo"
        recipient:
          $ref: "#/components/schemas/CoverLetterRecipient"
        place:
          type: string
          nullable: true
          maxLength: 100
          description: Lieu d'émission (ligne « Fait à … »)
          example: "Paris"
        date:
          type: string
          nullable: true
          format: date
          description: Date de la lettre
          example: "2026-10-19"
        subject:
          type: string
          nullable: true
          maxLength: 300
          description: Objet de la lettre
          example: "Candidature au poste d'ingénieur backend senior"
        salutation:
          type: string
          maxLength: 200
          description: Formule d'appel
          example: "Madame, Monsieur,"
        body:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            maxLength: 2000
          description: Corps de la lettre, un élément par paragraphe (texte brut)
        closing:
          type: string
          maxLength: 500
          description: Formule de politesse finale
          example: "Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées."
        signature:
          $ref: "#/components/schemas/CoverLetterSignature"

    GenerateLetterRequest:
      type: object
      description: |
        Fournir EXACTEMENT UN des deux champs `offer_text` ou `job_offer_id` ; fournir
        les deux ou aucun répond `422`. Si `cv_id` est fourni, `template_id` et `theme`
        omis sont hérités du CV (Pack de candidature assorti) ; une valeur explicite les
        remplace.
      required:
        - letter_name
      properties:
        letter_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Nom donné par l'utilisateur à cette lettre
          example: "Lettre - Ingénieur Backend Acme"
        offer_text:
          type: string
          minLength: 50
          maxLength: 200000
          description: Texte brut de l'offre d'emploi (même bornes que `GenerateCVRequest.offer_text`)
        job_offer_id:
          type: string
          format: uuid
          description: Identifiant d'une Offre déjà enregistrée
        cv_id:
          type: string
          format: uuid
          description: |
            CV (Variante) avec lequel la lettre forme un Pack. Optionnel : sans lui, la
            lettre est rédigée à partir du profil et de l'offre seuls.
        template_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Template de la lettre. Défaut : celui du CV si `cv_id` est fourni, sinon
            `modern_sobre`. Premium sans Pass actif : `402` (la lettre exige déjà un Pass).
          example: "modern_sobre"
        theme:
          allOf:
            - $ref: "#/components/schemas/CVTheme"
          description: |
            Thème CV INLINE, snapshoté dans la lettre. Défaut : celui du CV si `cv_id`
            est fourni, sinon le thème par défaut du Template.
        target_language:
          allOf:
            - $ref: "#/components/schemas/DocumentLanguage"
          default: fr
          description: |
            Langue de la lettre. Le contenu est RÉÉCRIT dans cette langue en visant
            l'offre (pas de traduction littérale ; décision D7 ouverte).
        tone:
          allOf:
            - $ref: "#/components/schemas/LetterTone"
          description: Ton souhaité. Optionnel ; défaut serveur `balanced`.

    LetterJobAccepted:
      type: object
      required:
        - job_id
        - job_type
        - status
      properties:
        job_id:
          type: string
          format: uuid
          description: Identifiant du job de génération de lettre
        job_type:
          type: string
          enum: [letter_generation]
          example: "letter_generation"
        status:
          type: string
          enum: [queued]
          example: "queued"
        message:
          type: string
          example: "Letter generation job accepted. Poll GET /v1/jobs/{job_id} for status."

    LetterListItem:
      type: object
      required:
        - id
        - letter_name
        - template_id
        - theme
        - language
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        letter_name:
          type: string
        cv_id:
          type: string
          nullable: true
          format: uuid
          description: CV assorti (Pack de candidature). Null si aucun, ou si le CV a été supprimé.
        job_offer_id:
          type: string
          nullable: true
          format: uuid
        template_id:
          type: string
          example: "modern_sobre"
        theme:
          allOf:
            - $ref: "#/components/schemas/CVTheme"
          description: Snapshot du Thème CV appliqué à cette lettre.
        language:
          $ref: "#/components/schemas/DocumentLanguage"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LetterDetailResponse:
      type: object
      description: |
        Lettre complète : ENVELOPPE (`template_id`, `theme`, `language`) + CONTENU
        canonique (`letter_data_json`, schéma `CoverLetterContent`).
      required:
        - id
        - letter_name
        - template_id
        - theme
        - language
        - letter_data_json
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        letter_name:
          type: string
        cv_id:
          type: string
          nullable: true
          format: uuid
          description: CV assorti (Pack de candidature). Null si aucun, ou si le CV a été supprimé.
        job_offer_id:
          type: string
          nullable: true
          format: uuid
        job_offer_context:
          type: string
          nullable: true
          description: Texte de l'offre d'emploi utilisée pour la génération
        template_id:
          type: string
          example: "modern_sobre"
        theme:
          allOf:
            - $ref: "#/components/schemas/CVTheme"
          description: Snapshot du Thème CV appliqué (objet stocké, pas une référence mutable).
        language:
          $ref: "#/components/schemas/DocumentLanguage"
        letter_data_json:
          $ref: "#/components/schemas/CoverLetterContent"
        is_editable:
          type: boolean
          description: |
            Calculé à la lecture (jamais persisté) : true si le Pass est actif.
            false = lecture et téléchargement seuls (décision D1) ; une édition
            répondrait `402`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateLetterRequest:
      type: object
      description: |
        Tous les champs sont optionnels ; au moins un doit être fourni. Le contenu et
        l'enveloppe sont indépendants : modifier l'un ne modifie jamais l'autre.
      properties:
        letter_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
        letter_data_json:
          $ref: "#/components/schemas/CoverLetterContent"
        template_id:
          type: string
          minLength: 1
          maxLength: 64
          description: "Nouveau Template (identifiant inconnu : `422`)"
        theme:
          allOf:
            - $ref: "#/components/schemas/CVTheme"
          description: Nouveau Thème CV (inline, snapshoté)
        language:
          allOf:
            - $ref: "#/components/schemas/DocumentLanguage"
          description: Nouvelle langue de RENDU (titres, dates). Ne traduit pas le contenu.

    # =========================================================================
    # Billing
    # =========================================================================

    PassType:
      type: string
      enum: [PASS_30_DAYS, PASS_90_DAYS]
      description: |
        Type de CareerPass acheté.
        - `PASS_30_DAYS` : acces illimité pendant 30 jours.
        - `PASS_90_DAYS` : acces illimité pendant 90 jours.

    CheckoutSessionRequest:
      type: object
      required:
        - pass_type
      properties:
        pass_type:
          $ref: "#/components/schemas/PassType"
        success_url:
          type: string
          description: URL de redirection après paiement réussi (override de la valeur par défaut)
          example: "https://app.talentious.fr/dashboard?payment=success"
        cancel_url:
          type: string
          description: URL de redirection après annulation du paiement
          example: "https://app.talentious.fr/billing?payment=cancelled"

    CheckoutSessionResponse:
      type: object
      required:
        - checkout_url
        - session_id
      properties:
        checkout_url:
          type: string
          description: URL Stripe Checkout vers laquelle rediriger l'utilisateur
          example: "https://checkout.stripe.com/pay/cs_test_..."
        session_id:
          type: string
          description: Identifiant de la session Stripe Checkout
          example: "cs_test_a1b2c3d4e5f6..."

    CatalogEntry:
      type: object
      required:
        - pass_type
        - duration_days
      properties:
        pass_type:
          $ref: "#/components/schemas/PassType"
        duration_days:
          type: integer
          description: Durée de validité du Pass en jours
          example: 30
        amount_cents:
          type: integer
          nullable: true
          description: |
            Prix en plus petite unité monétaire (centimes), lu depuis Stripe.
            `null` si Stripe n'est pas configuré ou si la récupération a échoué.
          example: 1900
        currency:
          type: string
          nullable: true
          description: Code ISO 4217 en minuscules (ex. `eur`). `null` si inconnu.
          example: "eur"

    BillingCatalogResponse:
      type: object
      required:
        - passes
      properties:
        passes:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEntry"

    BillingStatusResponse:
      type: object
      required:
        - has_active_pass
      properties:
        has_active_pass:
          type: boolean
          description: Vrai si l'utilisateur détient un CareerPass valide
          example: true
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: Date d'expiration du Pass actif, ou `null` si aucun
