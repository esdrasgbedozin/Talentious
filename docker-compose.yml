services:
  db:
    image: postgres:15
    container_name: talentious_db
    restart: always
    environment:
      - POSTGRES_USER=talentious
      - POSTGRES_PASSWORD=talentious
      - POSTGRES_DB=talentious
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: talentious_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - parser-pdf
      - analyseur-offre
      - redacteur-cv
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://talentious:talentious@db:5432/talentious}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      # Use an environment variable for SECRET_KEY in production. Default for local dev only.
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-chars}
      # Parser-PDF Agent URL (local development)
      PARSER_SERVICE_URL: ${PARSER_SERVICE_URL:-http://parser-pdf:8001}
      # Analyseur-Offre Agent URL (local development)
      ANALYZER_SERVICE_URL: ${ANALYZER_SERVICE_URL:-http://analyseur-offre:8002}
      # Rédacteur-CV Agent URL (local development)
      WRITER_SERVICE_URL: ${WRITER_SERVICE_URL:-http://redacteur-cv:8003}
      # Stripe (test-mode keys locally; Stripe CLI provides the webhook secret)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_30_DAYS: ${STRIPE_PRICE_30_DAYS:-}
      STRIPE_PRICE_90_DAYS: ${STRIPE_PRICE_90_DAYS:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Export-service (rendu PDF, M2) — consommé par le backend dès M2-T14.
      EXPORT_SERVICE_URL: ${EXPORT_SERVICE_URL:-http://export-service:8004}

  parser-pdf:
    build: ./agents/parser-pdf
    container_name: talentious_parser_pdf
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./agents/parser-pdf/app:/service/app
      - ./agents/parser-pdf/prompts:/service/prompts
      # Creds GCP hôte pour Vertex AI (extraction ProfileData, M8-T01)
      - ~/.config/gcloud/application_default_credentials.json:/tmp/gcp_creds.json:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_PORT: 8001
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-talentious-project}
      GCP_LOCATION: ${GCP_LOCATION:-eu}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_creds.json
      VERTEX_AI_MODEL: ${VERTEX_AI_MODEL:-gemini-3.5-flash}
      USE_SECRET_MANAGER: ${USE_SECRET_MANAGER:-false}

  analyseur-offre:
    build: ./agents/analyseur-offre
    container_name: talentious_analyseur_offre
    restart: always
    ports:
      - "8002:8002"
    volumes:
      - ./agents/analyseur-offre/app:/app/app
      - ./agents/analyseur-offre/prompts:/app/prompts
      # Mount GCP credentials from host for Vertex AI authentication
      - ~/.config/gcloud/application_default_credentials.json:/tmp/gcp_creds.json:ro
    depends_on:
      - parser-pdf
    environment:
      # Parser-PDF service URL
      PARSER_SERVICE_URL: ${PARSER_SERVICE_URL:-http://parser-pdf:8001}
      # GCP Configuration (required for Vertex AI)
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-talentious-project}
      # Endpoint UE multi-région (résidence des données UE, RGPD) — ADR-GENAI-SDK.
      GCP_LOCATION: ${GCP_LOCATION:-eu}
      # GCP Authentication (Application Default Credentials)
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_creds.json
      # Vertex AI Model — voir docs/adr/ADR-GENAI-SDK.md
      # gemini-3.5-flash via SDK google-genai (endpoint UE). thinking_level
      # remplace le contournement max_output=32k des 2.5.
      VERTEX_AI_MODEL: ${VERTEX_AI_MODEL:-gemini-3.5-flash}
      # Prompt Management (false = local files, true = Secret Manager)
      USE_SECRET_MANAGER: ${USE_SECRET_MANAGER:-false}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  redacteur-cv:
    build: ./agents/redacteur-cv
    container_name: talentious_redacteur_cv
    restart: always
    ports:
      - "8003:8003"
    volumes:
      - ./agents/redacteur-cv/app:/app/app
      - ./agents/redacteur-cv/prompts:/app/prompts
      # Mount GCP credentials from host for Vertex AI authentication
      - ~/.config/gcloud/application_default_credentials.json:/tmp/gcp_creds.json:ro
    environment:
      # GCP Configuration (required for Vertex AI)
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-talentious-project}
      # Endpoint UE multi-région (résidence des données UE, RGPD) — ADR-GENAI-SDK.
      GCP_LOCATION: ${GCP_LOCATION:-eu}
      # GCP Authentication (Application Default Credentials)
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_creds.json
      # Vertex AI Model — voir docs/adr/ADR-GENAI-SDK.md
      # gemini-3.5-flash via SDK google-genai (endpoint UE). thinking_level
      # remplace le contournement max_output=32k des 2.5.
      VERTEX_AI_MODEL: ${VERTEX_AI_MODEL:-gemini-3.5-flash}
      # Prompt Management (false = local files, true = Secret Manager)
      USE_SECRET_MANAGER: ${USE_SECRET_MANAGER:-false}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Rendu PDF (M2-T13) : IMAGE DE PROD (Chromium épinglé — ADR-PDF-RENDER),
  # exécutée comme en prod : FS read-only, écritures /tmp seul (tmpfs),
  # non-root (USER 1001 de l'image), --no-sandbox + compensations (décision 7).
  # Pas de volume source : ce service se reconstruit (make build), il ne se
  # hot-reload pas — fidélité au déployé > confort d'édition.
  export-service:
    build:
      context: .
      dockerfile: export-service/Dockerfile.prod
    container_name: talentious_export_service
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=512m
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      CHROMIUM_EXTRA_ARGS: "--no-sandbox --disable-dev-shm-usage"
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      RENDER_QUEUE_MAX: ${RENDER_QUEUE_MAX:-8}
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-120000}

  frontend:
    build:
      # Contexte RACINE depuis M0-T08 : le frontend importe le package workspace
      # @talentious/cv-render (hors de frontend/).
      context: .
      dockerfile: frontend/Dockerfile
    container_name: talentious_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - ./packages:/app/packages
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/frontend/.next
    environment:
      # Dev mode with file-system polling: inotify events don't cross the macOS
      # Docker bind mount, so without polling Next never hot-reloads host edits.
      NODE_ENV: ${FRONTEND_NODE_ENV:-development}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    depends_on:
      - backend

  # ===== TESTING & QUALITY ASSURANCE =====
  evals:
    build:
      context: .
      dockerfile: backend/evals/Dockerfile
    container_name: talentious_evals
    profiles:
      - testing # Only run when explicitly requested with --profile testing
    depends_on:
      - analyseur-offre
      - redacteur-cv
    volumes:
      - ./backend/evals/results:/evals/results # Persist results locally
    networks:
      - default

volumes:
  postgres_data:
