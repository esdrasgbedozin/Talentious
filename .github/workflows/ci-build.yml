# =============================================================================
# Garde-fou de BUILD sur PR — valide que toutes les images Docker se
# construisent AVANT le merge sur main (le deploy-prod.yml ne build qu'au push
# main). Introduit avec M0-T07 : le build frontend passe en contexte RACINE
# (workspaces npm) ; ce check attrape toute casse du Dockerfile/contexte/lockfile
# avant qu'elle n'atteigne la branche de déploiement.
# - AUCUN push d'image, AUCUNE auth GCP, AUCUN secret : build local au runner.
# - ubuntu-latest = linux/amd64 : parité avec la CI de déploiement et Cloud Run
#   (et avec les binaires natifs linux du package-lock.json racine).
# =============================================================================

name: CI Build (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "agents/**"
      - "export-service/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "**/*.dockerignore"
      - ".github/workflows/ci-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # M1-T01 — Garde-fou MIGRATIONS sur PR : cycle `upgrade head → downgrade base
  # → upgrade head` sur un Postgres ÉPHÉMÈRE (service container, détruit après
  # le job). Toute migration non réversible (downgrade manquant, incomplet, ou
  # qui fuit tables/types ENUM) casse ICI, avant le merge — plus jamais dans le
  # job `migrate` du déploiement prod. Runbook : docs/RUNBOOK_MIGRATIONS.md.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: talentious
          POSTGRES_PASSWORD: talentious
          POSTGRES_DB: talentious_migcheck
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Cycle up/down/up sur base éphémère
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://talentious:talentious@127.0.0.1:5432/talentious_migcheck
        run: python scripts/check_migrations.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile.prod
          - name: frontend
            # Contexte RACINE depuis M0-T07 (workspaces npm) — identique à
            # deploy-prod.yml.
            context: .
            dockerfile: frontend/Dockerfile.prod
          - name: export-service
            # Contexte RACINE (M2-T02) — identique à deploy-prod.yml : SSR du
            # package partagé packages/cv-render + lockfile unique racine.
            context: .
            dockerfile: export-service/Dockerfile.prod
          - name: parser-pdf
            context: agents/parser-pdf
            dockerfile: agents/parser-pdf/Dockerfile
          - name: analyseur-offre
            context: agents/analyseur-offre
            dockerfile: agents/analyseur-offre/Dockerfile
          - name: redacteur-cv
            context: agents/redacteur-cv
            dockerfile: agents/redacteur-cv/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} (sans push)
        run: |
          EXTRA_ARGS=()
          if [ "${{ matrix.name }}" = "frontend" ]; then
            # Mêmes build-args que le déploiement (valeurs PUBLIQUES, pas des secrets).
            EXTRA_ARGS=(
              --build-arg "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.talentious.app' }}"
              --build-arg "NEXT_PUBLIC_ENVIRONMENT=production"
              --build-arg "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID || '' }}"
            )
          fi
          docker build -f "${{ matrix.dockerfile }}" "${EXTRA_ARGS[@]}" \
            -t "${{ matrix.name }}:pr" "${{ matrix.context }}"
