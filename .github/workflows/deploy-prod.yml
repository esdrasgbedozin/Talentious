# =============================================================================
# Déploiement PRODUCTION — main → Cloud Run (europe-west9)
# =============================================================================
# - Auth GCP par Workload Identity Federation (aucune clé JSON — le provider
#   est verrouillé sur ce dépôt, cf. infra/cicd.tf). SA: github-deployer@.
# - Terraform possède la CONFIG des services (SA, secrets, scaling, env) ;
#   la CI ne fait que mettre à jour les IMAGES (`gcloud run services update`).
# - Ordre : tests → build/push → migrations (Cloud SQL proxy) → rollout → smoke.
# - Secret GitHub requis : CLOUD_SQL_DB_PASSWORD (migrations uniquement).
#   Variable GitHub optionnelle : NEXT_PUBLIC_API_URL (défaut: api.talentious.app).

name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "agents/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "**/*.dockerignore"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # requis pour l'échange OIDC (WIF)

concurrency:
  group: deploy-prod
  cancel-in-progress: false # jamais interrompre un déploiement en cours

env:
  PROJECT_ID: talentious-project
  PROJECT_NUMBER: "968343134767"
  REGION: europe-west9
  REGISTRY: europe-west9-docker.pkg.dev
  REPOSITORY: talentious-images
  SQL_CONNECTION: talentious-project:europe-west9:talentious-db-prod
  WIF_PROVIDER: projects/968343134767/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
  DEPLOYER_SA: github-deployer@talentious-project.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: talentious
          POSTGRES_PASSWORD: talentious
          POSTGRES_DB: talentious_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://talentious:talentious@localhost:5432/talentious_test
          SECRET_KEY: test-secret-key-for-ci-only-not-production
        run: python -m pytest -q
      - name: Run parser-pdf agent tests (coercition ProfileData, sans dépendances)
        working-directory: agents/parser-pdf
        run: python -m pytest tests -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile.prod
          - name: frontend
            # Contexte RACINE depuis M0-T07 : le build frontend consomme le
            # package workspace packages/cv-render + le lockfile unique racine.
            context: .
            dockerfile: frontend/Dockerfile.prod
          - name: parser-pdf
            context: agents/parser-pdf
            dockerfile: agents/parser-pdf/Dockerfile
          - name: analyseur-offre
            context: agents/analyseur-offre
            dockerfile: agents/analyseur-offre/Dockerfile
          - name: redacteur-cv
            context: agents/redacteur-cv
            dockerfile: agents/redacteur-cv/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Build and push ${{ matrix.name }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.name }}"
          EXTRA_ARGS=""
          if [ "${{ matrix.name }}" = "frontend" ]; then
            EXTRA_ARGS="--build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.talentious.app' }} --build-arg NEXT_PUBLIC_ENVIRONMENT=production --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID || '' }}"
          fi
          docker build -f ${{ matrix.dockerfile }} $EXTRA_ARGS \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ${{ matrix.context }}
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  migrate:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Start Cloud SQL proxy
        # Attente de DISPONIBILITÉ réelle au lieu d'un `sleep 5` aveugle : le
        # run #39 (2026-10-22) a échoué sur « server closed the connection
        # unexpectedly » — proxy lancé mais pas prêt (DET-CI-DBPROD). Un port
        # TCP ouvert ne prouve rien (le proxy ouvre son port AVANT de joindre
        # l'instance) : on sonde son endpoint /readiness (--health-check) —
        # proxy démarré et connexions initialisées. Ce n'est pas la preuve
        # qu'une requête SQL aboutit : le cas restant est absorbé par le retry
        # sur erreur de connexion du step suivant.
        run: |
          curl -sSLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          # SHA-256 officiel (notes de release GitHub v2.13.0, contre-vérifié
          # sur le binaire le 2026-10-23) : le proxy tourne avec les
          # identifiants WIF du déployeur, on ne l'exécute pas sans contrôle.
          echo "90fb622971bd8ed650f040dbdbc0f1be65ea528e2c72fa3b4717838e56abdf39  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 --health-check --http-address 127.0.0.1 --http-port 9090 \
            ${{ env.SQL_CONNECTION }} > proxy.log 2>&1 &
          PROXY_PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$PROXY_PID" 2>/dev/null; then
              echo "::error::Cloud SQL proxy mort au démarrage"; cat proxy.log; exit 1
            fi
            if curl -sf http://127.0.0.1:9090/readiness > /dev/null; then
              echo "Proxy prêt (essai $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::Cloud SQL proxy indisponible après 60 s"; cat proxy.log; exit 1
      - name: Run Alembic migrations
        working-directory: backend
        env:
          # Base RÉELLE de la prod : `talentious` — VÉRIFIÉ sur l'instance le
          # 2026-10-22 (`gcloud sql databases list` → postgres + talentious
          # seulement ; secret DATABASE_URL de l'app et Terraform `db_name`
          # cohérents). `talentious_app` n'existe qu'en LOCAL (compose) : le
          # hotfix #40 l'avait transposée à tort ici et cassait le migrate
          # (« database does not exist »).
          DATABASE_URL: postgresql+asyncpg://talentious-app:${{ secrets.CLOUD_SQL_DB_PASSWORD }}@127.0.0.1:5432/talentious
        # Un (1) retry, UNIQUEMENT sur erreur de CONNEXION (cas du run #39) :
        # une erreur SQL déterministe échoue immédiatement et bloque le
        # déploiement (fail-safe : pas de rollout sans migrations). Le retry
        # est sûr aujourd'hui car env.py exécute TOUT le run `upgrade` dans UNE
        # transaction (DDL transactionnel Postgres). ⚠️ Exception à ne PAS
        # étendre : une future migration non transactionnelle (CREATE INDEX
        # CONCURRENTLY, ALTER TYPE … ADD VALUE en autocommit_block) devra
        # retirer ce retry. Procédure manuelle : docs/RUNBOOK_MIGRATIONS.md.
        run: |
          set -o pipefail
          if ! alembic upgrade head 2>&1 | tee alembic.log; then
            if grep -qiE 'server closed the connection|connection refused|could not connect|connection reset|SSL SYSCALL' alembic.log; then
              echo "::warning::échec de CONNEXION au migrate — retry unique après 10 s"
              sleep 10
              alembic upgrade head
            else
              echo "::error::échec non transitoire des migrations — pas de retry"
              exit 1
            fi
          fi

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      # checkout DOIT précéder auth : il nettoie le workspace et effacerait le
      # fichier de credentials WIF créé par l'action auth (cause de l'échec du
      # premier run de purge).
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Roll out new images (config stays Terraform-owned)
        run: |
          for SVC in backend frontend parser-pdf analyseur-offre redacteur-cv; do
            IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/$SVC:${{ github.sha }}"
            echo "→ $SVC ($IMAGE)"
            gcloud run services update "$SVC" \
              --region "${{ env.REGION }}" \
              --image "$IMAGE" \
              --quiet
          done
      - name: Purge Firebase Hosting CDN cache
        # Next émet s-maxage=1an sur les pages pré-rendues ; sans redéploiement
        # de la façade Hosting, les POP CDN serviraient l'ancien HTML.
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
      - name: Smoke test
        run: |
          BACKEND_URL=$(gcloud run services describe backend --region ${{ env.REGION }} --format 'value(status.url)')
          FRONTEND_URL=$(gcloud run services describe frontend --region ${{ env.REGION }} --format 'value(status.url)')
          echo "backend:  $BACKEND_URL"
          echo "frontend: $FRONTEND_URL"
          curl -sf --retry 5 --retry-delay 5 "$BACKEND_URL/health" | grep -q healthy
          curl -sf --retry 5 --retry-delay 5 -o /dev/null "$FRONTEND_URL/"
          curl -sf --retry 3 --retry-delay 5 -o /dev/null "https://talentious.app/"
          echo "✅ Smoke OK"
